<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EDGE v2, Coinbase day and swing scanner</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"EDGE Scanner","short_name":"EDGE","display":"standalone","background_color":"%230c1220","theme_color":"%230c1220","start_url":"."}'>
<style>
:root{--bg:#0c1220;--sf:#151d2c;--sf2:#1c2637;--sf3:#243047;--rule:#24304a;--rule2:#33415d;--tx:#eef2f7;--mut:#93a0b8;--dim:#5b687f;--brass:#e8b04b;--brass2:#f6cf7c;--up:#3ddc97;--dn:#ff6b6b;--sky:#6eb4ff;--amber:#ffb454;--vio:#b48cff;--vio2:#cdb3ff;--acc:var(--brass);--accBg:rgba(232,176,75,.12);--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif}
body.swing{--acc:var(--vio);--accBg:rgba(180,140,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
#app{max-width:1120px;margin:0 auto;padding:10px 14px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mut{color:var(--mut)}.up{color:var(--up)}.dn{color:var(--dn)}.dim{color:var(--dim)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
header{display:flex;align-items:center;gap:12px;padding:8px 0 12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:22px;color:var(--acc);line-height:1;letter-spacing:.02em}
.brand small{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-top:4px;letter-spacing:0}
.seg{display:flex;background:var(--sf);border:1px solid var(--rule2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--mut);font-weight:700;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accBg);color:var(--acc)}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.live{background:var(--up);box-shadow:0 0 10px var(--up)}.dot.demo{background:var(--amber)}.dot.scanning{background:var(--sky);animation:pulse 1s infinite}.dot.blocked{background:var(--dn)}.dot.cached{background:var(--vio)}
@keyframes pulse{50%{opacity:.25}}
.btn{border:1px solid var(--rule2);background:var(--sf2);color:var(--tx);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--acc);color:#1d1400;border-color:var(--acc)}
body.swing .btn.primary{color:#170b2e}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:11px;border-radius:6px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--sf);border:1px solid var(--rule);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--mut);font-weight:600}
.progress{margin:0 0 12px}
.bar{height:4px;background:var(--sf2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--up));transition:width .3s}
.ptxt{font-size:12px;color:var(--mut);margin-top:6px}
.banner{border:1px solid var(--amber);background:rgba(255,180,84,.08);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner .btn{margin:8px 8px 0 0}
.today{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
.gauge{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge svg{width:170px;height:100px}
.gauge .big{position:absolute;top:44px;font-size:30px;font-weight:800;line-height:1}
.gauge .lab{font-size:12px;font-weight:700;letter-spacing:.02em}
.verdict{font-size:17px;font-weight:700;line-height:1.3}
.verdict .mut{font-weight:500;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sf2);border:1px solid var(--rule);color:var(--mut)}
.pill b{color:var(--tx);font-weight:700}
.pill.good{border-color:rgba(61,220,151,.4)}.pill.bad{border-color:rgba(255,107,107,.4)}.pill.stale{border-color:rgba(255,180,84,.5)}
.fresh{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--dim);margin-top:10px}
.fresh i{font-style:normal}.fresh .ok{color:var(--mut)}.fresh .no{color:var(--dn)}
.changed{margin-top:10px;font-size:13px;border-top:1px solid var(--rule);padding-top:8px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.badge.on{background:rgba(61,220,151,.15);color:var(--up)}.badge.off{background:rgba(255,107,107,.15);color:var(--dn)}.badge.neu{background:rgba(255,180,84,.15);color:var(--amber)}.badge.acc{background:var(--accBg);color:var(--acc)}
details.settings summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::after{content:'▾';color:var(--mut)}details[open].settings summary::after{content:'▴'}
details.settings summary .mut{font-weight:500;font-size:12.5px;text-align:right}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sec{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--acc);margin-top:6px;letter-spacing:.02em}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:600}
select,input,textarea{background:var(--sf2);border:1px solid var(--rule2);color:var(--tx);border-radius:9px;padding:9px 10px;font:14px var(--sans);width:100%}
textarea{min-height:56px;resize:vertical}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.pick{background:var(--sf);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pick.A{border-color:rgba(61,220,151,.45);box-shadow:inset 0 1px 0 rgba(61,220,151,.15)}
.pk-head{display:flex;align-items:flex-start;gap:10px}
.sym{font-size:21px;font-weight:800}.nm{color:var(--mut);font-size:13px;margin-left:6px}
.grade{margin-left:auto;font-weight:800;font-size:13px;padding:4px 9px;border-radius:8px;background:var(--sf2);border:1px solid var(--rule2);white-space:nowrap}
.grade.A{color:var(--up);border-color:rgba(61,220,151,.4)}.grade.B{color:var(--sky);border-color:rgba(110,180,255,.4)}.grade.C{color:var(--amber);border-color:rgba(255,180,84,.4)}
.track{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.track .tb{flex:1;min-width:80px;height:5px;background:var(--sf2);border-radius:3px;overflow:hidden}.track .tb i{display:block;height:100%;background:var(--up)}
.track.thin{color:var(--dim)}.track.thin .tb i{background:var(--dim)}
.pk-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.price{font-size:19px;font-weight:700}
.chip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--sf2);color:var(--mut);border:1px solid var(--rule)}
.chip.acc{color:var(--acc);border-color:var(--acc)}
.spark{margin-left:auto;width:96px;height:28px}
.chart{width:100%;height:150px;display:block}
.ladder{display:grid;grid-template-columns:82px 1fr auto;row-gap:2px;align-items:center;font-size:14px;border-left:2px solid var(--rule2);padding-left:10px}
.ladder .lv{display:contents}
.ladder .lv>span:first-child{font-size:12px;color:var(--mut);font-weight:600}
.ladder .lv>b{font-weight:700}
.ladder .lv>i{font-style:normal;font-size:12.5px;color:var(--mut);text-align:right}
.ladder .lv.t2 b,.ladder .lv.t1 b{color:var(--up)}.ladder .lv.stop b{color:var(--dn)}.ladder .lv.zone b{color:var(--brass2)}
body.swing .ladder .lv.zone b{color:var(--vio2)}
.ladder .lv.now>span:first-child{color:var(--acc)}
.ladder .lv.now>b{background:var(--accBg);border-radius:6px;padding:2px 6px;display:inline-block}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut)}
.meta b{color:var(--tx)}
.orders{display:grid;gap:5px;font-size:12.5px;background:var(--sf2);border-radius:10px;padding:8px 10px}
.orders div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.orders .k{color:var(--mut);width:64px;font-weight:600;font-size:11.5px}
.orders b{font-weight:700}
.orders .btn{margin-left:auto}
ul.why,ul.warn{list-style:none;display:grid;gap:4px;font-size:13px}
ul.why li::before{content:'▸';color:var(--up);margin-right:6px}ul.warn li::before{content:'!';color:var(--amber);font-weight:800;margin-right:8px}
.pk-actions{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.notrade{display:grid;gap:8px}
.notrade h2{font-size:19px;font-weight:800}
.tblwrap{overflow:auto;border:1px solid var(--rule);border-radius:14px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:13px}
th{position:sticky;top:0;background:var(--sf2);text-align:right;padding:9px 10px;font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap;user-select:none;font-weight:600}
th.l,td.l{text-align:left}
td{padding:8px 10px;border-top:1px solid var(--rule);text-align:right;white-space:nowrap}
tr.r{cursor:pointer}tr.r:active{background:var(--sf2)}
table.small{min-width:0;font-size:12.5px}table.small th,table.small td{padding:6px 8px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools input{width:auto;flex:1;min-width:140px}
.mon{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--sf);border:1px solid var(--rule);border-radius:12px;cursor:pointer}
.mrow .st{font-size:11.5px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--rule);border-radius:12px;padding:12px}
.stat .v{font-size:20px;font-weight:800;margin-top:2px}
.stat .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.jrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 12px;background:var(--sf);border:1px solid var(--rule);border-radius:12px;margin-bottom:8px;font-size:13px}
.jrow .sym{font-size:16px}
.jrow.shadow{opacity:.8;border-style:dashed}
.review{border:1px solid var(--acc);background:var(--accBg);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(12,18,32,.94);backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font-weight:600;font-size:12px;padding:10px 2px;border-radius:10px;cursor:pointer}
.tabs button.on{color:var(--acc);background:var(--accBg)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheetIn{background:var(--sf);border:1px solid var(--rule2);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:720px){.sheet{align-items:center}.sheetIn{border-radius:18px}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--sf2);border-radius:9px;padding:8px 10px}.kv .lbl{display:block;margin-bottom:2px}.kv b{font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--sf2);border:1px solid var(--rule2);color:var(--tx);padding:10px 14px;border-radius:10px;font-size:13px;z-index:40;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.help h3{margin:14px 0 6px;font-size:15px;color:var(--acc)}
.help p,.help li{font-size:14px;margin-bottom:6px}.help ol,.help ul{padding-left:20px}
.help code{background:var(--sf2);padding:1px 5px;border-radius:5px;font-size:12.5px}
.eq{width:100%;height:120px;display:block}
@media(max-width:640px){.today{grid-template-columns:1fr}.gauge{flex-direction:row;justify-content:flex-start}.gauge .big{left:64px;top:26px}.grid4{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr 1fr}.brand{font-size:19px}.seg button{padding:7px 10px;font-size:12px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">EDGE<small id="brandSub">Coinbase day scanner</small></div>
  <div class="seg" id="modeSeg"><button data-mode="day" class="on">Day</button><button data-mode="swing">Swing</button></div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusTxt">Ready</span></div>
  <button id="scanBtn" class="btn primary">Scan now</button>
</header>
<div id="progress" class="progress hidden"><div class="bar"><i id="pbar"></i></div><div id="ptxt" class="ptxt"></div></div>
<div id="banner" class="banner hidden"></div>
<section id="today" class="card hidden"></section>
<details id="settings" class="card settings">
  <summary>Settings <span id="setSum" class="mut"></span></summary>
  <div class="grid4">
    <div class="sec">Day mode</div>
    <label class="f">Trade horizon<select id="sDayHorizon"><option value="4">4 hours</option><option value="8">8 hours</option><option value="12">12 hours</option></select></label>
    <label class="f">Grade filter<select id="sDayGrade"><option value="conservative">Conservative, A only</option><option value="balanced">Balanced, A and B</option><option value="aggressive">Aggressive, adds C and bounces</option></select></label>
    <label class="f">Min Coinbase 24h volume $<input id="sMinVolDay" type="number" min="0" step="500000"></label>
    <div></div>
    <div class="sec">Swing mode</div>
    <label class="f">Grade filter<select id="sSwingGrade"><option value="conservative">Conservative, A only</option><option value="balanced">Balanced, A and B</option><option value="aggressive">Aggressive, adds C</option></select></label>
    <label class="f">Min Coinbase 24h volume $<input id="sMinVolSwing" type="number" min="0" step="500000"></label>
    <label class="f">Max hold, days<select id="sHoldDays"><option>10</option><option>15</option><option>20</option></select></label>
    <div></div>
    <div class="sec">Universe and account</div>
    <label class="f">Universe size<select id="sUniverse"><option value="100">Top 100</option><option value="200">Top 200</option><option value="300">Top 300</option></select></label>
    <label class="f">Rank universe by<select id="sRank"><option value="mcap">Market cap (CoinGecko)</option><option value="volume">Coinbase 24h volume</option></select></label>
    <label class="f">Max picks<select id="sMax"><option>3</option><option>5</option><option>8</option></select></label>
    <label class="f">Max slippage % on your order size<input id="sMaxSlip" type="number" min="0.01" step="0.05"></label>
    <label class="f">Account size $<input id="sAccount" type="number" min="1" step="1"></label>
    <label class="f">Risk per trade %<input id="sRisk" type="number" min="0.1" step="0.5"></label>
    <label class="f">Round-trip fee %<input id="sFee" type="number" min="0" step="0.1"></label>
    <label class="f">Max position % of account<input id="sAlloc" type="number" min="1" max="100" step="5"></label>
    <label class="f" style="grid-column:1/-1">Unlock watchlist, one per line as SYMBOL YYYY-MM-DD (coins are excluded from swing picks for 30 days before an unlock)<textarea id="sUnlocks" placeholder="ARB 2026-10-16&#10;SUI 2026-11-01"></textarea></label>
  </div>
</details>
<main>
  <section id="tab-picks" class="tab"></section>
  <section id="tab-scan" class="tab hidden"></section>
  <section id="tab-monitor" class="tab hidden"></section>
  <section id="tab-journal" class="tab hidden"></section>
  <section id="tab-backtest" class="tab hidden"></section>
  <section id="tab-help" class="tab hidden"></section>
</main>
</div>
<nav class="tabs">
  <button data-tab="picks" class="on">Picks</button>
  <button data-tab="scan">Scan</button>
  <button data-tab="monitor">Monitor</button>
  <button data-tab="journal">Journal</button>
  <button data-tab="backtest">Backtest</button>
  <button data-tab="help">Help</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheetIn"><div id="sheetBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
'use strict';
/* ===================== CONFIG & STATE ===================== */
const CB='https://api.exchange.coinbase.com';
const CG='https://api.coingecko.com/api/v3';
const HL='https://api.hyperliquid.xyz/info';
const LLAMA='https://stablecoins.llama.fi/stablecoins?includePrices=true';
const FNG='https://api.alternative.me/fng/?limit=30&format=json';
const EXCLUDE=new Set('USDT USDC DAI PYUSD EURC GUSD USDS TUSD FDUSD USDP PAX BUSD WBTC CBBTC CBETH WETH STETH WSTETH LSETH MSOL JITOSOL RETH TBTC PAXG XAUT USDE USD1 RLUSD USDY USD0 FRAX LUSD GHO CRVUSD EUR GBP CBXRP CBADA CBDOGE CBLTC WAXL SUSDE'.split(' '));
const SECTOR={BTC:'BTC',ETH:'ETH',SOL:'L1',XRP:'Payments',BNB:'Exchange',ADA:'L1',AVAX:'L1',DOT:'L1',NEAR:'L1',APT:'L1',SUI:'L1',SEI:'L1',TIA:'Modular',ATOM:'L1',ALGO:'L1',HBAR:'L1',ICP:'L1',TON:'L1',TRX:'L1',KAS:'L1',XLM:'Payments',LTC:'Payments',BCH:'Payments',DOGE:'Meme',SHIB:'Meme',PEPE:'Meme',WIF:'Meme',BONK:'Meme',FLOKI:'Meme',TRUMP:'Meme',POPCAT:'Meme',MOG:'Meme',SPX:'Meme',ARB:'L2',OP:'L2',MATIC:'L2',POL:'L2',STRK:'L2',ZK:'L2',MNT:'L2',IMX:'L2',BLAST:'L2',LINK:'Oracle',PYTH:'Oracle',UNI:'DeFi',AAVE:'DeFi',CRV:'DeFi',LDO:'DeFi',MKR:'DeFi',SKY:'DeFi',COMP:'DeFi',SNX:'DeFi',JUP:'DeFi',RAY:'DeFi',CAKE:'DeFi',DYDX:'DeFi',GMX:'DeFi',PENDLE:'DeFi',ENA:'DeFi',MORPHO:'DeFi',ONDO:'RWA',FET:'AI',RENDER:'AI',TAO:'AI',NEAR2:'AI',GRT:'AI',AKT:'AI',VIRTUAL:'AI',AI16Z:'AI',WLD:'AI',INJ:'DeFi',FIL:'Storage',AR:'Storage',STX:'BTCfi',CORE:'BTCfi',ETC:'L1',APE:'Gaming',SAND:'Gaming',MANA:'Gaming',AXS:'Gaming',GALA:'Gaming',IMX2:'Gaming',RONIN:'Gaming',ENS:'Infra',HNT:'DePIN',IOTX:'DePIN',JASMY:'DePIN',XTZ:'L1',EOS:'L1',NEO:'L1',VET:'L1',QNT:'Infra',ZEC:'Privacy',XMR:'Privacy',ROSE:'Privacy',CRO:'Exchange',OKB:'Exchange',HYPE:'Exchange',BGB:'Exchange',ETHFI:'DeFi',EIGEN:'Infra',ZRO:'Infra',W:'Infra',AXL:'Infra',COTI:'Payments',XDC:'Payments',KAVA:'L1',FLOW:'L1',MINA:'L1',EGLD:'L1',CHZ:'Fan',BAT:'Infra',ZRX:'DeFi',LRC:'L2',ANKR:'Infra',RPL:'DeFi',SUPER:'Gaming',PRIME:'Gaming',BEAM:'Gaming',PIXEL:'Gaming',SAFE:'Infra',BERA:'L1',S:'L1',IP:'AI',KAITO:'AI',PENGU:'Meme',MOVE:'L1',ME:'Infra',USUAL:'DeFi',ETHW:'L1',DASH:'Payments',RVN:'L1'};
const sectorOf=b=>SECTOR[b]||'Other';
const DEF={tradeMode:'day',universe:100,ranking:'mcap',maxPicks:5,account:500,riskPct:2,feePct:1.2,allocPct:40,minVolDay:2e6,minVolSwing:3e6,dayHorizon:8,dayGrade:'balanced',swingGrade:'balanced',holdDays:15,unlocks:'',maxSlip:0.15};
const S={settings:{...DEF},res:{day:null,swing:null},macro:{hl:null,stables:null,fng:null},journal:[],timer:null,sortKey:'score',sortDir:-1,tab:'picks',status:'idle',q:'',scanView:'deep',pickPrices:{},lastTick:null,scanning:false,prevOI:{},bt:null,demo:false};
const cur=()=>S.res[S.settings.tradeMode];
const isSwing=()=>S.settings.tradeMode==='swing';

/* ===================== UTILS ===================== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const last=a=>a[a.length-1];
const sum=a=>a.reduce((x,y)=>x+y,0);
const mean=a=>a.length?sum(a)/a.length:0;

function prescore(u,mode){const g=u.cg||{};let s=0;

  else{s+=clamp(g.r14||0,-30,30)*0.6+clamp(g.r30||0,-50,50)*0.4+clamp(g.r7||0,-20,20)*0.3;
    const sp=g.spark;if(sp&&sp.length>=48){let upDays=0;for(let d=1;d<=7;d++){const i=sp.length-1-(d-1)*24,j=i-24;if(j>=0&&sp[i]>sp[j])upDays++;}s+=upDays*2;}}

/* ===================== DATA LAYER (public APIs, no keys) ===================== */
const limiter=(()=>{const rate=8;let tokens=rate,t=Date.now();return{async acquire(){for(;;){const now=Date.now();tokens=Math.min(rate,tokens+(now-t)/1000*rate);t=now;if(tokens>=1){tokens-=1;return;}await sleep(50);}}};})();

function intersect(mk,m,limit){const seen=new Set(),out=[];for(const c of mk){if(seen.has(c.sym))continue;const p=m.get(c.sym);if(!p)continue;seen.add(c.sym);out.push({...p,name:c.name||c.sym,rank:c.rank,mcap:c.mcap,cgVol:c.vol,cg:c});if(out.length>=limit)break;}if(out.length<20)throw new Error('mcap rank too small');return out;}
async function loadHL(){const r=await api(HL,2,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'metaAndAssetCtxs'})});if(!Array.isArray(r)||!r[0]||!r[0].universe||!Array.isArray(r[1]))throw new Error('bad hl');const map=new Map();r[0].universe.forEach((u,i)=>{const c=r[1][i];if(!c)return;const raw=String(u.name||'');let name=(/^k[A-Z]/.test(raw)?raw.slice(1):raw).toUpperCase();const mark=+c.markPx||0,oi=+c.openInterest||0,f=+c.funding||0;const oiUsd=oi*mark;const prev=S.prevOI[name];const oiChg=prev&&prev.oi>0&&Date.now()-prev.t<7*864e5?(oiUsd/prev.oi-1)*100:null;map.set(name,{apr:f*24*365*100,funding:f,oiUsd,oiChg,premium:(+c.premium||0)*100,dayVol:+c.dayNtlVlm||0,mark});});if(!map.size)throw new Error('empty hl');return{map,at:Date.now()};}
async function loadStables(){const r=await api(LLAMA,2);const list=r&&r.peggedAssets;if(!Array.isArray(list))throw new Error('bad llama');let total=0,prevW=0,prevD=0;for(const a of list){if(a.pegType!=='peggedUSD')continue;const c=a.circulating&&a.circulating.peggedUSD||0,w=a.circulatingPrevWeek&&a.circulatingPrevWeek.peggedUSD||0,d=a.circulatingPrevDay&&a.circulatingPrevDay.peggedUSD||0;if(c>1e8){total+=c;prevW+=w||c;prevD+=d||c;}}if(!(total>0))throw new Error('empty llama');return{total,chg7:prevW?(total/prevW-1)*100:null,chg1:prevD?(total/prevD-1)*100:null,at:Date.now()};}
async function loadFng(){const r=await api(FNG,2);const d=r&&r.data;if(!Array.isArray(d)||!d.length)throw new Error('bad fng');const vals=d.map(x=>+x.value).filter(x=>x>=0);const value=vals[0];return{value,cls:d[0].value_classification||'',pct30:pctRank(vals,value),hist:vals,at:Date.now()};}
async function candles(id,g){const raw=await api(CB+'/products/'+id+'/candles?granularity='+g);if(!Array.isArray(raw))throw new Error('bad candles');return raw.map(c=>({t:+c[0],l:+c[1],h:+c[2],o:+c[3],c:+c[4],v:+c[5]})).filter(c=>c.c>0).sort((a,b)=>a.t-b.t);}
async function book(id){const r=await api(CB+'/products/'+id+'/book?level=2');const asks=(r.asks||[]).map(x=>[+x[0],+x[1]]).filter(x=>x[0]>0&&x[1]>0),bids=(r.bids||[]).map(x=>[+x[0],+x[1]]).filter(x=>x[0]>0&&x[1]>0);if(!asks.length||!bids.length)throw new Error('empty book');return{ask:asks[0][0],bid:bids[0][0],spread:(asks[0][0]/bids[0][0]-1)*100,asks,bids};}
function slippageFor(bk,usd){let rem=usd,cost=0,qty=0;for(const [p,s] of bk.asks){const take=Math.min(rem/p,s);cost+=take*p;qty+=take;rem-=take*p;if(rem<=1e-9)break;}if(rem>1e-6||!qty)return 5;const avg=cost/qty,mid=(bk.ask+bk.bid)/2;return (avg/mid-1)*100;}
function makeCtx(){const d=new Date();d.setHours(0,0,0,0);return{dayStart:d.getTime(),settings:S.settings,regime:null,unlocks:parseUnlocks(S.settings.unlocks)};}

/* ===================== SCAN (two-stage funnel) ===================== */
async function scan(){
  if(S.scanning)return;const mode=S.settings.tradeMode,st=S.settings;S.scanning=true;S.demo=false;
  setStatus('scanning','Connecting');showProgress(1,'Loading Coinbase product list');hideBanner();$('scanBtn').disabled=true;
  const ctx=makeCtx();
  try{
    const m=await loadProducts();
    const macroP=Promise.allSettled([loadHL(),loadStables(),loadFng()]);
    let uni=null;const c1map=new Map();
    if(st.ranking==='mcap'){try{showProgress(3,'Ranking '+st.universe+' coins by market cap');uni=intersect(await loadMarkets(st.universe>150?2:1),m,st.universe);}catch(e){toast('CoinGecko unavailable, ranking by Coinbase volume instead');}}
    if(!uni){const all=[...m.values()];const res=await pool(all,async u=>({u,c:await candles(u.id,3600)}),6,(d,t)=>showProgress(3+d/t*47,'Ranking '+all.length+' pairs by 24h volume, '+d+'/'+t));
      uni=res.filter(r=>r&&r.c.length>=48).map(r=>({u:r.u,c:r.c,vol:sum(r.c.slice(-24).map(x=>x.c*x.v))})).sort((a,b)=>b.vol-a.vol).slice(0,st.universe).map((r,i)=>{c1map.set(r.u.id,r.c);return{...r.u,rank:i+1,cgVol:r.vol};});}
    const [hlR,stR,fnR]=await macroP;
    S.macro.hl=hlR.status==='fulfilled'?hlR.value:{err:true,at:Date.now()};S.macro.stables=stR.status==='fulfilled'?stR.value:{err:true,at:Date.now()};S.macro.fng=fnR.status==='fulfilled'?fnR.value:{err:true,at:Date.now()};
    const hlMap=S.macro.hl.map;for(const u of uni)u.hl=hlMap?hlMap.get(u.base)||null:null;
    const deepN=st.universe<=100?uni.length:92;let finalists=uni;
    if(uni.length>deepN){showProgress(5,'Pre-screening '+uni.length+' coins');for(const u of uni)u.pre=prescore(u,mode);finalists=uni.slice().sort((a,b)=>b.pre-a.pre).slice(0,deepN);for(const b of ['BTC','ETH']){const u=uni.find(x=>x.base===b);if(u&&!finalists.includes(u))finalists.push(u);}}
    const rest=uni.filter(u=>!finalists.includes(u));
    const base=c1map.size?50:6,span=c1map.size?46:90,gA=mode==='day'?3600:86400,gB=mode==='day'?900:21600;
    const res=await pool(finalists,async u=>{const a=(mode==='day'&&c1map.get(u.id))||await candles(u.id,gA);const b=await candles(u.id,gB);return{u,a,b};},6,(d,t)=>showProgress(base+d/t*span,'Pulling '+(mode==='day'?'1h and 15m':'daily and 6h')+' candles, '+d+'/'+t));
    let btcD=null;if(mode==='swing'){const r=res.find(x=>x&&x.u.base==='BTC');btcD=r?r.a:null;}if(!btcD){try{btcD=await candles('BTC-USD',86400);}catch(e){}}
    await finishScan(res.filter(Boolean),ctx,mode,rest,btcD);
  }catch(e){
    console.error(e);hideProgress();setStatus('blocked','No live data');$('scanBtn').disabled=false;
    showBanner('<b>Live data could not load.</b> This sandbox or your network is blocking outside connections (Brave: set Shields down for this page). Download the file and open it in a browser for live Coinbase data, or load demo data to explore the app.<br><button class="btn sm" onclick="scan()">Try again</button><button class="btn sm" onclick="loadDemo()">Load demo data</button>');
  }finally{S.scanning=false;}
}
async function finishScan(res,ctx,mode,rest,btcD){
  const analyses=res.map(r=>mode==='day'?analyzeDay(r.u,r.a,r.b,ctx):analyzeSwing(r.u,r.a,r.b,ctx)).filter(Boolean);
  if(!analyses.length){hideProgress();setStatus('blocked','No usable data');$('scanBtn').disabled=false;showBanner('Coinbase returned no candle data. <button class="btn sm" onclick="scan()">Try again</button>');return;}
  if(mode==='swing')postSwing(analyses);
  const regime=buildBudget(analyses,btcD,S.macro,mode);ctx.regime=regime;
  const items=analyses.map(a=>{const plan=planFor(a,ctx);return{a,plan,size:sizeFor(plan,a,S.settings,regime.mult)};});
  const cands=selectCandidates(items,S.settings,S.settings.maxPicks*2+2);
  showProgress(97,'Checking order book depth on '+cands.length+' candidates');
  if(S.demo){for(const it of cands)it.plan.slip=0.04;}else await pool(cands,async it=>{try{const bk=await book(it.a.id);it.plan.slip=slippageFor(bk,it.size.usd);it.plan.spread=bk.spread;}catch(e){it.plan.slip=null;}},4);
  const picks=[];for(const it of cands){if(it.plan.slip!=null&&it.plan.slip>S.settings.maxSlip){it.plan.tradeable=false;it.plan.skip='Order book too thin: '+it.plan.slip.toFixed(2)+'% slippage on a $'+it.size.usd.toFixed(0)+' order';it.plan.reason=it.plan.skip;continue;}picks.push(it);if(picks.length>=S.settings.maxPicks)break;}
  for(const p of picks)p.live={price:p.a.price,t1:false,t2:false,stop:false};
  const prev=S.res[mode];
  S.res[mode]={mode,analyses:items,picks,regime,lastScan:Date.now(),rest:rest||[],btcD,demo:S.demo,prevPicks:prev?prev.picks.map(p=>p.a.base):null,prevBudget:prev?prev.regime.budget:null,prevAt:prev?prev.lastScan:null};
  if(!S.demo&&S.macro.hl&&S.macro.hl.map){const o={};for(const [b,h] of S.macro.hl.map)o[b]={oi:h.oiUsd,t:Date.now()};S.prevOI=o;store.set('edge2_prevoi',o);}
  if(!S.demo)shadowLog(mode,picks,regime);
  saveCache(mode);
  hideProgress();$('scanBtn').disabled=false;$('scanBtn').textContent='Rescan';
  setStatus(S.demo?'demo':'live',S.demo?'Demo data':'Live, scanned '+timeStr(Date.now()));
  renderAll();startMonitor();if(!S.demo)reconcile();
  toast(picks.length?picks.length+' '+mode+' setups, risk budget '+regime.budget+' of 100':'No '+mode+' setups meet the bar, risk budget '+regime.budget+' of 100');
}
function recompute(){const r=cur();if(!r)return;const ctx={...makeCtx(),regime:r.regime};const old=new Map(r.picks.map(p=>[p.a.id,p.live]));
  r.analyses=r.analyses.map(it=>{const plan=planFor(it.a,ctx);if(it.plan&&it.plan.slip!=null){plan.slip=it.plan.slip;plan.spread=it.plan.spread;}return{a:it.a,plan,size:sizeFor(plan,it.a,S.settings,r.regime.mult)};});
  const cands=selectCandidates(r.analyses,S.settings,S.settings.maxPicks*2+2);const picks=[];for(const it of cands){if(it.plan.slip!=null&&it.plan.slip>S.settings.maxSlip){it.plan.tradeable=false;it.plan.reason='Order book too thin at this size';continue;}picks.push(it);if(picks.length>=S.settings.maxPicks)break;}
  r.picks=picks;for(const p of r.picks)p.live=old.get(p.a.id)||{price:(S.pickPrices[p.a.id]||{}).price||p.a.price,t1:false,t2:false,stop:false};renderAll();}

/* ===================== SHADOW LOG, RECONCILE, MONITOR ===================== */
function shadowLog(mode,picks,regime){const now=Date.now();let n=0;for(const p of picks){if(!(p.plan.grade==='A'||p.plan.grade==='B'))continue;if(S.journal.some(j=>j.shadow&&j.id===p.a.id&&j.mode===mode&&j.status==='open'))continue;const usd=p.size.usd||100;
  S.journal.push({uid:'s'+now.toString(36)+(n++),shadow:true,mode,id:p.a.id,base:p.a.base,grade:p.plan.grade,setup:p.plan.setup,score:p.plan.score,budget:regime.budget,entry:p.a.price,usd,coins:usd/p.a.price,t1:p.plan.t1,t2:p.plan.t2,stop:p.plan.stop,openedAt:now,expiresAt:now+p.plan.horizonMs,status:'open',t1Hit:false,last:p.a.price,riskUsd:usd*((p.a.price-p.plan.stop)/p.a.price+S.settings.feePct/100)});}
  if(n)save();}
function applyCandle(j,k,g){const endT=k.t*1000+g*1000;
  if(!j.t1Hit){if(k.l<=j.stop){closeTrade(j,j.stop,'Stopped out',endT);return true;}if(k.h>=j.t1){j.t1Hit=true;if(k.h>=j.t2){closeTrade(j,j.t2,'Both targets hit',endT);return true;}}}
  else{if(k.l<=j.entry){closeTrade(j,j.entry,'Half at target, rest at breakeven',endT);return true;}if(k.h>=j.t2){closeTrade(j,j.t2,'Both targets hit',endT);return true;}}
  if(j.expiresAt&&endT>=j.expiresAt){closeTrade(j,k.c,'Time stop',endT);return true;}
  j.last=k.c;return false;}
async function reconcile(){if(S.demo)return;const open=S.journal.filter(j=>j.status==='open'&&j.id);if(!open.length)return;const now=Date.now(),byId=new Map();for(const j of open){if(!byId.has(j.id))byId.set(j.id,[]);byId.get(j.id).push(j);}let changed=false;
  await pool([...byId.keys()],async id=>{const js=byId.get(id);const age=now-Math.min(...js.map(j=>j.openedAt));const g=age<3*864e5?900:age<12*864e5?3600:21600;let c;try{c=await candles(id,g);}catch(e){return;}
    for(const j of js){const from=j.reconciledTo||j.openedAt;for(const k of c){if(k.t*1000+g*1000<=from)continue;if(applyCandle(j,k,g))break;}if(j.status==='open')j.reconciledTo=last(c).t*1000;changed=true;}},4);
  if(changed){save();renderJournal();renderMonitor();}}
function startMonitor(){stopMonitor();if(S.demo)return;S.timer=setInterval(()=>monitorTick(false),isSwing()?300000:60000);}
function stopMonitor(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
async function monitorTick(manual){if(S.demo){if(manual)toast('Live prices are off in demo mode');return;}const r=cur();const ids=new Set((r?r.picks:[]).map(p=>p.a.id));for(const j of S.journal)if(j.status==='open'&&j.id)ids.add(j.id);if(!ids.size)return;
  const res=await pool([...ids],async id=>({id,tk:await api(CB+'/products/'+id+'/ticker')}),4);const now=Date.now();let changed=false;
  for(const x of res){if(!x||!x.tk)continue;const px=+x.tk.price;if(!(px>0))continue;S.pickPrices[x.id]={price:px,t:now};
    if(r)for(const p of r.picks){if(p.a.id!==x.id)continue;const L=p.live;L.price=px;if(px>=p.plan.t1)L.t1=true;if(px>=p.plan.t2)L.t2=true;if(px<=p.plan.stop&&!L.t1)L.stop=true;}
    for(const j of S.journal){if(j.id!==x.id||j.status!=='open')continue;j.last=px;changed=true;
      if(px>=j.t1&&!j.t1Hit){j.t1Hit=true;if(!j.shadow)toast(j.base+' hit the first target: sell half, stop moves to entry');}
      if(px>=j.t2)closeTrade(j,j.t2,'Both targets hit',now);else if(px<=j.stop&&!j.t1Hit)closeTrade(j,j.stop,'Stopped out',now);else if(j.t1Hit&&px<=j.entry)closeTrade(j,j.entry,'Half at target, rest at breakeven',now);else if(j.expiresAt&&now>=j.expiresAt)closeTrade(j,px,'Time stop',now);}}
  S.lastTick=now;if(changed)save();renderPicks();renderMonitor();renderJournal();if(manual)toast('Prices refreshed');}

/* ===================== BACKTEST (swing rules on daily candles) ===================== */
function runBacktest(){const r=S.res.swing;if(!r||!r.analyses.some(it=>it.a.cd)){S.bt={err:'Run a fresh swing scan first. The backtest walks the daily candles that scan pulled.'};renderBacktest();return;}
  const st=S.settings,cost=st.feePct+0.2,trades=[],btcMap=new Map();
  if(r.btcD){const C=r.btcD.map(x=>x.c),e20=ema(C,20),e50=ema(C,50);r.btcD.forEach((k,i)=>btcMap.set(k.t,C[i]>e20[i]&&e20[i]>e50[i]));}
  let coins=0;
  for(const it of r.analyses){const cd=it.a.cd;if(!cd||cd.length<120)continue;coins++;const n=cd.length,C=cd.map(x=>x.c),e20=ema(C,20),e50=ema(C,50),A=atr(cd),AD=adx(cd),R=rsi(C),notional=cd.map(x=>x.c*x.v);
    let i=60;while(i<n-2){const p=C[i],atrv=A[i];if(!(atrv>0)||!(p>e20[i]&&e20[i]>e50[i]&&e20[i]>e20[i-5])||R[i]>80){i++;continue;}
      const ext=(p-e20[i])/atrv,d20H=hiOf(cd,i-20,i),avg20=mean(notional.slice(i-20,i))||1,relVol=notional[i]/avg20,ret14=(p/C[i-14]-1)*100,ret30=(p/C[i-30]-1)*100;let setup=null;
      if(p>d20H&&relVol>=1.5&&ext<=3&&ret30>-10)setup='Breakout';else if(ext>=-1&&ext<=1&&ret14>0&&C[i]>C[i-1])setup='Pullback';else if(ext>1&&ext<=2&&ret14>0&&AD[i]>=20&&C[i]>C[i-1])setup='Momentum';
      if(!setup){i++;continue;}
      const entry=cd[i+1].o,stopDist=clamp(entry-loOf(cd,i-10,i)+0.1*atrv,1.2*atrv,2*atrv),stop=entry-stopDist,t1=entry+2.5*atrv,t2=entry+4*atrv;let t1Hit=false,exit=null,how=null,j=i+1;
      for(;j<n&&j<=i+st.holdDays;j++){const k=cd[j];if(!t1Hit){if(k.l<=stop){exit=stop;how='stop';break;}if(k.h>=t1){t1Hit=true;if(k.h>=t2){exit=t2;how='t2';break;}}}else{if(k.l<=entry){exit=entry;how='breakeven';break;}if(k.h>=t2){exit=t2;how='t2';break;}}}
      if(exit==null){j=Math.min(j,n-1);exit=cd[j].c;how='time';}
      const pnl=(t1Hit?0.5*(t1-entry)/entry+0.5*(exit-entry)/entry:(exit-entry)/entry)*100-cost,stopPct=stopDist/entry*100;
      trades.push({base:it.a.base,setup,entryT:cd[i+1].t,exitT:cd[j].t,pnl,r:pnl/(stopPct+cost),t1Hit,how,btcOk:btcMap.has(cd[i].t)?btcMap.get(cd[i].t):true});i=j+1;}}
  const lastT=trades.length?Math.max(...trades.map(t=>t.exitT)):0,cut=lastT-90*86400;
  const risk=st.account*st.riskPct/100;
  const stats=list=>{if(!list.length)return{n:0};const w=list.filter(t=>t.pnl>0),l=list.filter(t=>t.pnl<=0),gw=sum(w.map(t=>t.pnl)),gl=-sum(l.map(t=>t.pnl));const eq=list.slice().sort((a,b)=>a.exitT-b.exitT);let e=0,pk=0,dd=0;const curve=[];for(const t of eq){e+=t.r*risk;pk=Math.max(pk,e);dd=Math.max(dd,pk-e);curve.push(e);}
    return{n:list.length,win:w.length/list.length*100,avgWin:w.length?mean(w.map(t=>t.pnl)):0,avgLoss:l.length?mean(l.map(t=>t.pnl)):0,expR:mean(list.map(t=>t.r)),pf:gl?gw/gl:Infinity,t1:list.filter(t=>t.t1Hit).length/list.length*100,total:e,dd,curve};};
  const filt=trades.filter(t=>t.btcOk);
  S.bt={coins,cost,risk,all:{is:stats(trades.filter(t=>t.entryT<cut)),oos:stats(trades.filter(t=>t.entryT>=cut)),full:stats(trades)},filt:{is:stats(filt.filter(t=>t.entryT<cut)),oos:stats(filt.filter(t=>t.entryT>=cut)),full:stats(filt)},bySetup:['Breakout','Pullback','Momentum'].map(s=>({s,...stats(filt.filter(t=>t.setup===s))})),recent:filt.slice().sort((a,b)=>b.exitT-a.exitT).slice(0,15),span:r.analyses.reduce((m,it)=>Math.max(m,(it.a.cd||[]).length),0),at:Date.now()};
  renderBacktest();}

function rng(seed){let s=seed>>>0;return()=>{s+=0x6D2B79F5;let t=Math.imul(s^(s>>>15),1|s);t^=t+Math.imul(t^(t>>>7),61|t);return((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function synth(seed,p0,vol,n,step,drift){const r=rng(seed);const out=[];const t0=Math.floor(Date.now()/1000/step)*step-(n-1)*step;let p=p0*(0.85+r()*0.3);let regime=drift;for(let k=0;k<n;k++){if(k%60===0)regime=drift+(r()-0.5)*vol*0.6;const g=gauss(r);const ret=regime+vol*g;const o=p,c=o*Math.exp(ret);const h=Math.max(o,c)*(1+Math.abs(gauss(r))*vol*0.6),l=Math.min(o,c)*(1-Math.abs(gauss(r))*vol*0.6);const v=(1e6/p0)*(0.4+r()*1.2)*(1+2*Math.abs(g));out.push({t:t0+k*step,o,h,l,c,v});p=c;}return out;}
function agg(c,k){const out=[];for(let i=0;i+k<=c.length;i+=k){const g=c.slice(i,i+k);out.push({t:g[0].t,o:g[0].o,h:Math.max(...g.map(x=>x.h)),l:Math.min(...g.map(x=>x.l)),c:g[k-1].c,v:sum(g.map(x=>x.v))});}return out;}
function buildDemoRes(mode){return DEMO.map((d,i)=>{const drift=((i*37)%11/11-0.42)*0.0012;const u={id:d[0]+'-USD',base:d[0],name:d[1],rank:i+1,limitOnly:false,mcap:1e9/(i+1),cgVol:5e7/(i+1),hl:{apr:((i*53)%17-6)*8,funding:0,oiUsd:1e8/(i+1),oiChg:((i*29)%9-4)*1.5,premium:0,dayVol:0}};
  if(mode==='day'){const c15=synth(1000+i*7919,d[2],d[3],1200,900,drift);return{u,a:agg(c15,4).slice(-300),b:c15.slice(-300)};}
  const c6=synth(5000+i*7919,d[2],d[3]*Math.sqrt(24),1200,21600,((i*37)%11/11-0.42)*0.004);return{u,a:agg(c6,4).slice(-300),b:c6.slice(-300)};});}

  async set(k,v){const s=JSON.stringify(v);if(typeof window!=='undefined'&&window.storage&&window.storage.set){try{await window.storage.set(k,s,false);return;}catch(e){}}try{localStorage.setItem(k,s);}catch(e){this.mem[k]=v;}}};

function saveCache(mode){const r=S.res[mode];if(!r||r.demo)return;try{store.set('edge2_cache_'+mode,{mode,lastScan:r.lastScan,regime:r.regime,rest:r.rest.map(u=>({base:u.base,name:u.name,rank:u.rank,cg:u.cg?{r24:u.cg.r24,r7:u.cg.r7,r30:u.cg.r30,vol:u.cg.vol,price:u.cg.price}:null,pre:u.pre})),items:r.analyses.map(it=>({a:stripA(it.a),plan:it.plan,size:it.size})),pickIds:r.picks.map(p=>p.a.id),macro:{hl:S.macro.hl?{at:S.macro.hl.at,err:!!S.macro.hl.err,n:S.macro.hl.map?S.macro.hl.map.size:0}:null,stables:S.macro.stables,fng:S.macro.fng}});}catch(e){}}
function loadCache(c){if(!c||!c.items)return null;const items=c.items.map(it=>({a:it.a,plan:it.plan,size:it.size}));const picks=c.pickIds.map(id=>items.find(it=>it.a.id===id)).filter(Boolean);for(const p of picks)p.live={price:p.a.price,t1:false,t2:false,stop:false};return{mode:c.mode,analyses:items,picks,regime:c.regime,lastScan:c.lastScan,rest:c.rest||[],btcD:null,demo:false,cached:true,prevPicks:null,prevBudget:null};}

function ladder(a,plan,px){const sw=a.mode==='swing';return '<div class="ladder">'
  +'<div class="lv t2"><span>Sell rest</span><b class="num">'+fmtPrice(plan.t2)+'</b><i class="num">'+fmtPct(plan.t2Pct)+', net '+fmtPct(plan.netT2)+(sw?', 4 ATR':'')+'</i></div>'
  +'<div class="lv t1"><span>Sell half</span><b class="num">'+fmtPrice(plan.t1)+'</b><i class="num">'+fmtPct(plan.t1Pct)+', net '+fmtPct(plan.netT1)+(sw?', 2.5 ATR':'')+'</i></div>'

function calib(mode,grade,setup){const rows=S.journal.filter(j=>j.status==='closed'&&j.mode===mode&&(!grade||j.grade===grade)&&(!setup||j.setup===setup));const n=rows.length;if(!n)return{n:0,t1:0,stop:0,avgR:0};return{n,t1:rows.filter(j=>j.t1Hit).length/n*100,stop:rows.filter(j=>j.how==='Stopped out').length/n*100,avgR:mean(rows.map(j=>j.r||0)),win:rows.filter(j=>j.pnl>0).length/n*100};}
function trackLine(mode,grade,setup){const c=calib(mode,grade,null),cs=calib(mode,grade,setup);const use=cs.n>=10?cs:c,label=(cs.n>=10?setup+' ':'')+grade+' grade';
  if(!use.n)return '<div class="track thin">No track record yet for '+label+' in '+mode+' mode. Shadow trades build it automatically.</div>';

function openLog(id){const r=cur();const it=r&&r.analyses.find(x=>x.a.id===id);if(!it)return;const {a,plan,size}=it;const px=(S.pickPrices[id]||{}).price||a.price;
  $('sheetBody').innerHTML='<div class="pk-head"><div><span class="sym">'+esc(a.base)+'</span><span class="nm">Log a '+modeWord()+' trade</span></div><button class="btn sm ghost" style="margin-left:auto" onclick="closeSheet()">Close</button></div>'
  +'<div class="grid2"><label class="f">Entry price<input id="lEntry" type="number" step="any" value="'+px+'"></label><label class="f">Position size $<input id="lUsd" type="number" step="any" value="'+size.usd.toFixed(2)+'"></label><label class="f">Sell half at<input id="lT1" type="number" step="any" value="'+plan.t1+'"></label><label class="f">Sell rest at<input id="lT2" type="number" step="any" value="'+plan.t2+'"></label><label class="f">Exit below<input id="lStop" type="number" step="any" value="'+plan.stop+'"></label><label class="f">Note<input id="lNote" placeholder="optional"></label></div>'
  +'<p class="mut" style="font-size:12.5px;margin:10px 0">Tracked with live prices while the app is open and reconciled from candles when you come back, so a wick between checks is booked conservatively (stop before target). Keep your real sell and stop orders on Coinbase.</p><button class="btn primary" onclick="submitLog(\''+a.id+'\')">Save trade</button>';
  $('sheet').classList.remove('hidden');}
function submitLog(id){const r=cur();const it=r&&r.analyses.find(x=>x.a.id===id);if(!it)return;const v=k=>parseFloat($(k).value);const entry=v('lEntry'),usd=v('lUsd'),t1=v('lT1'),t2=v('lT2'),stop=v('lStop');
  if(!(entry>0&&usd>0&&t1>entry&&t2>=t1&&stop<entry)){toast('Check the numbers: exit < entry < sell half <= sell rest');return;}
  const j={uid:'j'+Date.now().toString(36)+Math.floor(Math.random()*1e4),shadow:false,mode:it.a.mode,id,base:it.a.base,grade:it.plan.grade,setup:it.plan.setup,score:it.plan.score,budget:r.regime.budget,entry,usd,coins:usd/entry,t1,t2,stop,note:$('lNote').value,openedAt:Date.now(),expiresAt:Date.now()+it.plan.horizonMs*(it.a.mode==='swing'?1:1.5),status:'open',t1Hit:false,last:entry,riskUsd:usd*((entry-stop)/entry+S.settings.feePct/100)};
  S.journal.push(j);save();closeSheet();renderJournal();renderMonitor();showTab('journal');toast(j.base+' logged, tracking targets and stop');startMonitor();}
function unreal(j){const px=j.last||j.entry;return (j.t1Hit?0.5*j.coins*(j.t1-j.entry)+0.5*j.coins*(px-j.entry):j.coins*(px-j.entry))-j.usd*S.settings.feePct/100;}
function closeTrade(j,px,how,at){const fees=j.usd*S.settings.feePct/100;const pnl=(j.t1Hit?0.5*j.coins*(j.t1-j.entry)+0.5*j.coins*(px-j.entry):j.coins*(px-j.entry))-fees;j.status='closed';j.exit=px;j.how=how;j.pnl=pnl;j.pnlPct=pnl/j.usd*100;j.closedAt=at||Date.now();j.r=pnl/Math.max(1e-9,j.riskUsd);if(!j.shadow){save();toast(j.base+' closed, '+how+' ('+money(pnl)+')');}}
function findJ(uid){return S.journal.find(j=>j.uid===uid);}
function markT1(uid){const j=findJ(uid);if(!j)return;j.t1Hit=true;save();renderJournal();toast(j.base+': half sold, stop is now your entry');}
function delTrade(uid){S.journal=S.journal.filter(j=>j.uid!==uid);save();renderJournal();renderMonitor();}
function clearClosed(shadow){S.journal=S.journal.filter(j=>!(j.status==='closed'&&!!j.shadow===shadow));save();renderJournal();}
function setReview(uid,v){const j=findJ(uid);if(!j)return;j.followed=v;save();renderJournal();}
function openClose(uid){const j=findJ(uid);if(!j)return;$('sheetBody').innerHTML='<div class="pk-head"><div><span class="sym">'+esc(j.base)+'</span><span class="nm">Close trade</span></div><button class="btn sm ghost" style="margin-left:auto" onclick="closeSheet()">Cancel</button></div><label class="f" style="margin-top:12px">Exit price<input id="cPx" type="number" step="any" value="'+(j.last||j.entry)+'"></label><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" onclick="doClose(\''+uid+'\')">Book it</button></div>';$('sheet').classList.remove('hidden');}
function doClose(uid){const j=findJ(uid);const px=parseFloat($('cPx').value);if(!j||!(px>0)){toast('Enter a valid exit price');return;}closeTrade(j,px,'Closed manually');closeSheet();renderJournal();renderMonitor();}
function exportJournal(){try{const blob=new Blob([JSON.stringify(S.journal,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='edge-journal-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){toast('Export not supported here');}}
function jrow(j,shadow){const u=unreal(j);const base='<div class="jrow'+(shadow?' shadow':'')+'"><b class="sym">'+esc(j.base)+'</b><span class="chip">'+(j.mode||'day')+(j.grade?' '+j.grade:'')+(j.setup?' '+j.setup:'')+'</span>';
  if(j.status==='open')return base+'<span class="num">in '+fmtPrice(j.entry)+', now '+fmtPrice(j.last||j.entry)+'</span><span class="num '+(u>=0?'up':'dn')+'">'+money(u)+'</span><span class="mut num">$'+j.usd.toFixed(0)+', half '+fmtPrice(j.t1)+', rest '+fmtPrice(j.t2)+', exit '+fmtPrice(j.stop)+(j.t1Hit?', half sold':'')+(j.expiresAt?', time stop '+dateStr(j.expiresAt):'')+'</span><span style="margin-left:auto;display:flex;gap:6px">'+(shadow?'':(j.t1Hit?'':'<button class="btn sm" onclick="markT1(\''+j.uid+'\')">Sold half</button>')+'<button class="btn sm primary" onclick="openClose(\''+j.uid+'\')">Close</button>')+'<button class="btn sm ghost" onclick="delTrade(\''+j.uid+'\')">Remove</button></span></div>';
  return base+'<span class="num '+(j.pnl>=0?'up':'dn')+'">'+money(j.pnl)+' ('+fmtPct(j.pnlPct,2)+', '+(j.r>=0?'+':'')+(j.r||0).toFixed(2)+'R)</span><span class="mut">'+esc(j.how)+'</span><span class="mut num">'+fmtPrice(j.entry)+' to '+fmtPrice(j.exit)+', '+dateStr(j.openedAt)+' to '+dateStr(j.closedAt)+'</span>'+(!shadow&&j.followed!=null?'<span class="chip">'+(j.followed?'followed plan':'deviated')+'</span>':'')+'<span style="margin-left:auto"><button class="btn sm ghost" onclick="delTrade(\''+j.uid+'\')">Remove</button></span></div>';}
function calibTable(mode){const grades=['A','B','C'],setups=mode==='swing'?['Breakout','Pullback','Leader','Momentum']:['Breakout','Pullback','Momentum','Bounce'];const row=(k,c)=>'<tr><td class="l">'+k+'</td><td class="num">'+c.n+'</td><td class="num">'+(c.n?c.t1.toFixed(0)+'%':'—')+'</td><td class="num">'+(c.n?c.stop.toFixed(0)+'%':'—')+'</td><td class="num">'+(c.n?c.win.toFixed(0)+'%':'—')+'</td><td class="num '+(c.n?(c.avgR>=0?'up':'dn'):'')+'">'+(c.n?(c.avgR>=0?'+':'')+c.avgR.toFixed(2):'—')+'</td></tr>';
  return '<div class="tblwrap"><table class="small"><thead><tr><th class="l">'+mode+' mode</th><th>Trades</th><th>T1 hit</th><th>Stopped</th><th>Win</th><th>Avg R</th></tr></thead><tbody>'+grades.map(g=>row('Grade '+g,calib(mode,g,null))).join('')+setups.map(s=>row(s,calib(mode,null,s))).join('')+row('All',calib(mode,null,null))+'</tbody></table></div>';}
function renderJournal(){const el=$('tab-journal');const real=S.journal.filter(j=>!j.shadow),shadow=S.journal.filter(j=>j.shadow);const closed=real.filter(j=>j.status==='closed'),open=real.filter(j=>j.status==='open');const wins=closed.filter(j=>j.pnl>0).length,pnl=sum(closed.map(j=>j.pnl)),avgR=closed.length?mean(closed.map(j=>j.r||0)):0;
  const fol=closed.filter(j=>j.followed===true),dev=closed.filter(j=>j.followed===false);const adh=fol.length+dev.length?'followed '+fol.length+' ('+(fol.length?(fol.filter(j=>j.pnl>0).length/fol.length*100).toFixed(0):0)+'% won), deviated '+dev.length+' ('+(dev.length?(dev.filter(j=>j.pnl>0).length/dev.length*100).toFixed(0):0)+'% won)':'rate closed trades below';
  let h='<div class="stats"><div class="stat"><span class="lbl">Closed trades</span><div class="v num">'+closed.length+'</div><div class="s">yours, not shadow</div></div><div class="stat"><span class="lbl">Win rate</span><div class="v num">'+(closed.length?(wins/closed.length*100).toFixed(0)+'%':'—')+'</div><div class="s">'+adh+'</div></div><div class="stat"><span class="lbl">Net profit</span><div class="v num '+(pnl>=0?'up':'dn')+'">'+(closed.length?money(pnl):'—')+'</div><div class="s">after '+S.settings.feePct+'% fees</div></div><div class="stat"><span class="lbl">Average R</span><div class="v num">'+(closed.length?avgR.toFixed(2):'—')+'</div><div class="s">profit per dollar risked</div></div></div>';
  const rev=closed.filter(j=>j.followed==null).slice(-3);for(const j of rev)h+='<div class="review"><span><b>'+esc(j.base)+'</b> closed '+esc(j.how.toLowerCase())+' ('+money(j.pnl)+'). Did you follow the plan?</span><span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm primary" onclick="setReview(\''+j.uid+'\',true)">Followed it</button><button class="btn sm" onclick="setReview(\''+j.uid+'\',false)">Deviated</button></span></div>';
  if(!S.journal.length)h+='<div class="card empty">No trades yet. Every A and B pick is shadow-logged automatically after each live scan, so the track record builds whether you trade or not. Use <b>Log trade</b> on a pick to track a real position.</div>';

  const so=shadow.filter(j=>j.status==='open'),sc=shadow.filter(j=>j.status==='closed');

function renderMonitor(){const el=$('tab-monitor'),r=cur();const open=S.journal.filter(j=>j.status==='open'&&!j.shadow),picks=r?r.picks:[];
  if(!picks.length&&!open.length){el.innerHTML='<div class="card empty">Nothing to watch yet. After a scan, the picks and any logged trades show here with live prices, refreshed every '+(isSwing()?'5 minutes':'60 seconds')+' while the page is open.</div>';return;}

  for(const p of picks){const L=p.live||{};const px=L.price||p.a.price,chg=(px/p.a.price-1)*100,lo=p.plan.stop,hi=p.plan.t2,pos=clamp((px-lo)/((hi-lo)||1)*100,0,100);
    const st=L.t2?['Target 2 reached','up']:L.t1?['Target 1 reached','up']:L.stop?['Stop hit','dn']:px>=p.a.price?['In profit','up']:['Below entry','mut'];

  for(const j of open){const u=unreal(j),px=j.last||j.entry,pos=clamp((px-j.stop)/((j.t2-j.stop)||1)*100,0,100);h+='<div class="mrow" onclick="showTab(\'journal\')"><div><b class="sym" style="font-size:16px">'+esc(j.base)+'</b><div class="mut" style="font-size:11.5px">your '+(j.mode||'day')+' trade</div></div><div><div class="num" style="display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap"><span>'+fmtPrice(px)+' <span class="'+(u>=0?'up':'dn')+'">'+money(u)+'</span></span><span class="mut">in '+fmtPrice(j.entry)+(j.t1Hit?', half sold':'')+'</span></div><div class="bar" style="margin-top:6px"><i style="width:'+pos+'%;background:linear-gradient(90deg,var(--dn),var(--acc),var(--up))"></i></div></div><div class="st '+(u>=0?'up':'dn')+'">'+(u>=0?'Winning':'Losing')+'</div></div>';}
  el.innerHTML=h+'</div>';}

/* ===================== BACKTEST VIEW ===================== */
function eqSvg(curve){if(!curve||curve.length<2)return '';const W=600,H=120,mn=Math.min(0,...curve),mx=Math.max(0,...curve),rng=mx-mn||1;const pts=curve.map((v,i)=>(i/(curve.length-1)*W).toFixed(1)+','+(H-4-(v-mn)/rng*(H-8)).toFixed(1)).join(' ');const y0=(H-4-(0-mn)/rng*(H-8)).toFixed(1);return '<svg class="eq" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><line x1="0" x2="'+W+'" y1="'+y0+'" y2="'+y0+'" stroke="var(--rule2)" stroke-dasharray="3 3"/><polyline points="'+pts+'" fill="none" stroke="'+(last(curve)>=0?'var(--up)':'var(--dn)')+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';}
function btCell(s,label){if(!s||!s.n)return '<div class="stat"><span class="lbl">'+label+'</span><div class="v">—</div><div class="s">no trades</div></div>';return '<div class="stat"><span class="lbl">'+label+'</span><div class="v num '+(s.expR>=0?'up':'dn')+'">'+(s.expR>=0?'+':'')+s.expR.toFixed(2)+'R</div><div class="s num">'+s.n+' trades, '+s.win.toFixed(0)+'% win, T1 '+s.t1.toFixed(0)+'%, PF '+(isFinite(s.pf)?s.pf.toFixed(2):'∞')+'<br>'+money(s.total)+' net, max drawdown '+money(-s.dd)+'</div></div>';}
function renderBacktest(){const el=$('tab-backtest'),b=S.bt,r=S.res.swing,can=r&&!r.cached&&r.analyses.some(it=>it.a.cd);
  let h='<div class="card"><b>Backtest the swing rules on real daily candles</b><p class="mut" style="font-size:13.5px;margin:6px 0 10px">Walks every deep-scanned coin day by day using only information available at each close: enter at the next open, stop at 1.2 to 2 ATR, sell half at 2.5 ATR, rest at 4 ATR or the '+S.settings.holdDays+'-day time stop. Charges your fee setting plus 0.2% slippage per trade, and books the stop first whenever a bar touches both. The last 90 days are held out as the honest number.</p><button class="btn primary" onclick="runBacktest()"'+(can?'':' disabled')+'>Run backtest</button>'+(can?'':'<span class="mut" style="font-size:12.5px;margin-left:10px">Run a fresh swing scan first (cached scans do not keep the candles)</span>')+'</div>';
  if(b&&b.err)h+='<div class="card">'+esc(b.err)+'</div>';
  else if(b){h+='<div class="lbl" style="margin:4px 0 8px">With the BTC trend filter (the system as shipped)</div><div class="stats">'+btCell(b.filt.oos,'Last 90 days, out of sample')+btCell(b.filt.is,'Earlier period')+btCell(b.all.oos,'No BTC filter, last 90 days')+btCell(b.all.is,'No BTC filter, earlier')+'</div>';
    h+='<div class="card"><span class="lbl">Equity curve, filtered trades, $'+b.risk.toFixed(0)+' risk per trade, '+b.coins+' coins, up to '+b.span+' days of history</span>'+eqSvg(b.filt.full.curve)+'</div>';
    h+='<div class="card"><span class="lbl">By setup, filtered, all periods</span><div class="tblwrap" style="margin-top:8px"><table class="small"><thead><tr><th class="l">Setup</th><th>Trades</th><th>Win</th><th>T1 hit</th><th>Avg win</th><th>Avg loss</th><th>Exp. R</th></tr></thead><tbody>'+b.bySetup.map(s=>'<tr><td class="l">'+s.s+'</td><td class="num">'+(s.n||0)+'</td><td class="num">'+(s.n?s.win.toFixed(0)+'%':'—')+'</td><td class="num">'+(s.n?s.t1.toFixed(0)+'%':'—')+'</td><td class="num up">'+(s.n?fmtPct(s.avgWin):'—')+'</td><td class="num dn">'+(s.n?fmtPct(s.avgLoss):'—')+'</td><td class="num">'+(s.n?(s.expR>=0?'+':'')+s.expR.toFixed(2):'—')+'</td></tr>').join('')+'</tbody></table></div></div>';
    h+='<div class="card"><span class="lbl">Most recent filtered trades</span><div class="tblwrap" style="margin-top:8px"><table class="small"><thead><tr><th class="l">Coin</th><th class="l">Setup</th><th>Entered</th><th>Exited</th><th class="l">How</th><th>Net</th><th>R</th></tr></thead><tbody>'+b.recent.map(t=>'<tr><td class="l"><b>'+esc(t.base)+'</b></td><td class="l">'+t.setup+'</td><td class="num">'+dateStr(t.entryT*1000)+'</td><td class="num">'+dateStr(t.exitT*1000)+'</td><td class="l">'+t.how+'</td><td class="num '+(t.pnl>=0?'up':'dn')+'">'+fmtPct(t.pnl)+'</td><td class="num">'+(t.r>=0?'+':'')+t.r.toFixed(2)+'</td></tr>').join('')+'</tbody></table></div></div>';
    h+='<div class="card mut" style="font-size:13px">Read it like this: if the last 90 days look much worse than the earlier period, the rules are overfit to the earlier tape and should not be trusted. Survivorship bias is present (only coins on Coinbase today are tested) and the Leader setup is not backtested because it needs the whole universe at each date. Costs are '+b.cost.toFixed(1)+'% round trip. Treat a positive expectancy under 0.15R as noise.</div>';}
  el.innerHTML=h;}

/* ===================== SETTINGS, HELP, BOOT ===================== */
const SET=[['sDayHorizon','dayHorizon',v=>parseInt(v,10)],['sDayGrade','dayGrade',String],['sMinVolDay','minVolDay',parseFloat],['sSwingGrade','swingGrade',String],['sMinVolSwing','minVolSwing',parseFloat],['sHoldDays','holdDays',v=>parseInt(v,10)],['sUniverse','universe',v=>parseInt(v,10)],['sRank','ranking',String],['sMax','maxPicks',v=>parseInt(v,10)],['sMaxSlip','maxSlip',parseFloat],['sAccount','account',parseFloat],['sRisk','riskPct',parseFloat],['sFee','feePct',parseFloat],['sAlloc','allocPct',parseFloat],['sUnlocks','unlocks',String]];
const RESCAN=new Set(['universe','ranking']);
function bindSettings(){for(const [id,key,cast] of SET){const el=$(id);el.value=S.settings[key];el.onchange=()=>{const v=cast(el.value);if(typeof v==='number'&&!(v>=0)){el.value=S.settings[key];return;}S.settings[key]=v;save();updateSetSum();if(RESCAN.has(key))toast('Rescan to apply the new universe');else recompute();};}updateSetSum();}
function updateSetSum(){const s=S.settings;$('setSum').textContent=(s.tradeMode==='swing'?'swing, '+s.swingGrade+', hold '+s.holdDays+'d':'day, '+s.dayHorizon+'h, '+s.dayGrade)+', top '+s.universe+', $'+s.account+' at '+s.riskPct+'% risk, '+s.feePct+'% fees';}
function renderHelp(){$('tab-help').innerHTML='<div class="card help">'
 +'<h3>Two modes, one engine</h3><p><b>Day</b> uses 1h and 15m candles and looks for a move it can close inside your horizon (4 to 12 hours). <b>Swing</b> uses daily and 6h candles and looks for a 1 to 3 week trend trade with 2.5 and 4 ATR targets. Both share the same journal, the same risk budget and the same fee gate. Switch with the toggle at the top. Each mode keeps its own last scan.</p>'
 +'<h3>Routine</h3><ol><li><b>Day:</b> scan in the morning, read the Today card first. Risk budget under 50 means no new longs, however good a coin looks. Buy only inside the buy zone with a limit order, place the sell-half order at the first target and the stop-limit at the exit level straight away. Rescan around midday if everything closed.</li><li><b>Swing:</b> scan Sunday evening and again mid-week. Picks are meant to be entered with a limit order in the zone over the next day or two, not chased. Sell half at 2.5 ATR, move the stop to your entry, then let the rest run to 4 ATR or a daily close under the 20-day EMA. Time stop after '+S.settings.holdDays+' days if nothing has happened. Check once a day, not every hour.</li><li>Log every real trade. When it closes, tap whether you followed the plan. That single tap is what turns the journal into feedback.</li></ol>'
 +'<h3>Risk budget (0 to 100)</h3><p>Replaces the old three-state regime. BTC daily trend 30 points, market breadth 20, perp funding and open interest from Hyperliquid 20, stablecoin supply change from DefiLlama 15, Fear & Greed 15. 80+ is full size, 65 to 79 is 75% size, 50 to 64 is half size and A grades only, under 50 is stand down (day mode still shows A setups at half size). Missing data sources score neutral so the app never fails because one feed is down.</p>'
 +'<h3>How picks are chosen</h3><ul><li><b>Universe:</b> top 100, 200 or 300 by market cap that trade against USD on Coinbase, stablecoins and wrapped tokens removed. Above 100 the app pre-screens everything with one CoinGecko request (7-day hourly sparklines, multi-window returns, turnover) and deep-scans the strongest 92 plus BTC and ETH, so 300 coins cost the same time as 100.</li><li><b>Score out of 100:</b> trend structure 25, momentum 20, volume 15, entry location 20, risk budget 10, fee efficiency 10, then penalties for chasing, overbought readings, crowded funding, thin books, unlock windows and, in swing mode, runs longer than 35 days (the research shows reversal risk rises past that point). A is 78+, B is 66+, C is 55+.</li><li><b>Day setups:</b> Breakout, Pullback, Momentum, Bounce (aggressive only). <b>Swing setups:</b> Breakout above the 20-day high on 1.5x volume, Pullback to the 20-day EMA in an uptrend, Leader (top 10% relative strength versus BTC over 30 days), Momentum (trend holding 1 to 2 ATR above EMA20 with ADX over 20). No dip-buying in swing mode: the research is clear that past losers rebound unpredictably.</li><li><b>Diversification:</b> at most two picks per sector and no two picks whose returns correlate above 0.85. Held-back coins are listed under the picks with the reason.</li><li><b>Order book check:</b> before a coin becomes a pick the app pulls the live Coinbase book and walks it for your exact order size. Anything above your slippage cap is dropped.</li><li><b>Sizing:</b> position = (account × risk % × budget multiplier) ÷ (stop distance + fees), capped by your max position %.</li></ul>'
 +'<h3>Track record and shadow trades</h3><p>After every live scan, each A and B pick is logged as a shadow trade whether or not you take it, then booked against its targets and stop from live prices and, when you come back later, from Coinbase candles. After a few weeks the picks show their real first-target rate by grade and setup. If A grades are not beating B grades in that table, the score is wrong and should be refit, not trusted.</p>'
 +'<h3>Backtest</h3><p>The Backtest tab replays the swing rules over the daily candles from your last swing scan (up to 300 days per coin), with fees, slippage and worst-case fills. The last 90 days are shown separately as the out-of-sample number. It is a sanity check on the rules, not a promise about next month.</p>'
 +'<h3>Fees, the real enemy</h3><p>Coinbase Advanced Trade fees depend on your 30-day volume: under $1,000 it is about 1.20% for market orders and 0.60% for limit orders that wait on the book, $1,000 to $10,000 about 0.75% / 0.35%, above $10,000 about 0.40% / 0.25%. Coinbase One removes trading fees only on the simple app up to your plan\'s monthly volume cap, and the roughly 0.5% spread each way still applies there, so enter 1.0 for that case. The default 1.2% assumes limit orders at the lowest Advanced tier. With fees that size, day trades need coins moving 3% or more a day, which is exactly why swing trades with 10 to 20% targets carry the fee so much better.</p>'
 +'<h3>Unlocks</h3><p>There is no free unlock feed, so the app keeps a watchlist you maintain in Settings (one line per coin, symbol and date). Any coin within 30 days of an unlock is excluded from swing picks and flagged in day mode. Check a token unlock calendar once a week for the coins you hold or watch.</p>'
 +'<h3>What to expect</h3><p>Day mode: roughly 55 to 65% first-target rate on filtered setups in a risk-on tape, with fees eating a large share of each win. Swing mode: a lower win rate, around 40 to 45%, with profit concentrated in a handful of large winners at about 1.6 to 2 reward to risk. Six losers in a row is normal for a swing system, not a broken app. The Journal tab will tell you which of these numbers the app is actually delivering.</p>'
 +'<h3>Install</h3><ul><li><b>Android (Pixel):</b> host the file on GitHub Pages as <code>index.html</code>, open the https link in Chrome or Brave, then menu <code>⋮</code> and <b>Add to Home screen</b>. Brave: if the scan fails but demo works, set Shields down for the page.</li><li><b>PC:</b> double-click the file. Chrome, Edge, Brave and Firefox all work.</li><li><b>Claude:</b> the preview sandbox blocks internet access, so use <b>Load demo data</b> to tweak the design, then download for live data.</li></ul>'
 +'<h3>Storage</h3><p>Journal, settings, the last scan of each mode and the funding snapshot save in this browser (or Claude\'s artifact storage). Clearing site data clears them. Export the journal from the Journal tab before switching devices.</p></div>';}
async function boot(){try{const s=await store.get('edge2_settings');if(s&&typeof s==='object')S.settings={...DEF,...s};let j=await store.get('edge2_journal');if(!Array.isArray(j)){const old=await store.get('edge_journal');j=Array.isArray(old)?old.map(x=>({...x,mode:'day',shadow:false})):[];}S.journal=j;const oi=await store.get('edge2_prevoi');if(oi&&typeof oi==='object')S.prevOI=oi;
    for(const m of ['day','swing']){const c=await store.get('edge2_cache_'+m);const r=loadCache(c);if(r){S.res[m]=r;if(c.macro){S.macro.stables=c.macro.stables;S.macro.fng=c.macro.fng;S.macro.hl=c.macro.hl?{at:c.macro.hl.at,err:c.macro.hl.err,map:null}:null;}}}}catch(e){console.error(e);}
  bindSettings();renderHelp();setMode(S.settings.tradeMode);$('scanBtn').onclick=()=>scan();
  document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  $('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
  if(S.journal.some(j=>j.status==='open')){startMonitor();reconcile();}}
if(typeof document!=='undefined'&&document.getElementById('app'))boot();
</script>
