<!DOCTYPE html>
<html lang="en">
<head>

<title>EDGE, Coinbase intraday scanner</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"EDGE Intraday Scanner","short_name":"EDGE","display":"standalone","background_color":"%230c1220","theme_color":"%230c1220","start_url":"."}'>
<style>
:root{--bg:#0c1220;--sf:#151d2c;--sf2:#1c2637;--rule:#24304a;--rule2:#33415d;--tx:#eef2f7;--mut:#93a0b8;--dim:#5b687f;--brass:#e8b04b;--brass2:#f6cf7c;--up:#3ddc97;--dn:#ff6b6b;--sky:#6eb4ff;--amber:#ffb454;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
#app{max-width:1120px;margin:0 auto;padding:10px 14px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mut{color:var(--mut)}.up{color:var(--up)}.dn{color:var(--dn)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
header{display:flex;align-items:center;gap:12px;padding:8px 0 12px}
.brand{font-weight:800;font-size:22px;color:var(--brass);line-height:1;letter-spacing:.02em}
.brand small{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-top:4px;letter-spacing:0}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.live{background:var(--up);box-shadow:0 0 10px var(--up)}.dot.demo{background:var(--amber)}.dot.scanning{background:var(--sky);animation:pulse 1s infinite}.dot.blocked{background:var(--dn)}
@keyframes pulse{50%{opacity:.25}}
.btn{border:1px solid var(--rule2);background:var(--sf2);color:var(--tx);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--brass);color:#1d1400;border-color:var(--brass)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--sf);border:1px solid var(--rule);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--mut);font-weight:600}
.progress{margin:0 0 12px}
.bar{height:4px;background:var(--sf2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--up));transition:width .3s}
.ptxt{font-size:12px;color:var(--mut);margin-top:6px}
.banner{border:1px solid var(--amber);background:rgba(255,180,84,.08);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner .btn{margin:8px 8px 0 0}
.regime{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.regime .k{display:flex;flex-direction:column;gap:3px}
.regime .v{font-size:19px;font-weight:700}
.regime .sub{font-size:12px;color:var(--mut)}
.regime .note{grid-column:1/-1;font-size:14px;border-top:1px solid var(--rule);padding-top:10px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.badge.on{background:rgba(61,220,151,.15);color:var(--up)}.badge.off{background:rgba(255,107,107,.15);color:var(--dn)}.badge.neu{background:rgba(255,180,84,.15);color:var(--amber)}
details.settings summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::after{content:'▾';color:var(--mut)}details[open].settings summary::after{content:'▴'}
details.settings summary .mut{font-weight:500;font-size:12.5px;text-align:right}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:600}
select,input{background:var(--sf2);border:1px solid var(--rule2);color:var(--tx);border-radius:9px;padding:9px 10px;font:14px var(--sans);width:100%}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.pick{background:var(--sf);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pick.A{border-color:rgba(61,220,151,.45);box-shadow:inset 0 1px 0 rgba(61,220,151,.15)}
.pk-head{display:flex;align-items:flex-start;gap:10px}
.sym{font-size:21px;font-weight:800}.nm{color:var(--mut);font-size:13px;margin-left:6px}
.grade{margin-left:auto;font-weight:800;font-size:13px;padding:4px 9px;border-radius:8px;background:var(--sf2);border:1px solid var(--rule2);white-space:nowrap}
.grade.A{color:var(--up);border-color:rgba(61,220,151,.4)}.grade.B{color:var(--sky);border-color:rgba(110,180,255,.4)}.grade.C{color:var(--amber);border-color:rgba(255,180,84,.4)}
.pk-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.price{font-size:19px;font-weight:700}
.chip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--sf2);color:var(--mut);border:1px solid var(--rule)}
.spark{margin-left:auto;width:96px;height:28px}
.ladder{display:grid;grid-template-columns:82px 1fr auto;row-gap:2px;align-items:center;font-size:14px;border-left:2px solid var(--rule2);padding-left:10px}
.ladder .lv{display:contents}
.ladder .lv>span:first-child{font-size:12px;color:var(--mut);font-weight:600}
.ladder .lv>b{font-weight:700}
.ladder .lv>i{font-style:normal;font-size:12.5px;color:var(--mut);text-align:right}
.ladder .lv.t2 b,.ladder .lv.t1 b{color:var(--up)}.ladder .lv.stop b{color:var(--dn)}.ladder .lv.zone b{color:var(--brass2)}
.ladder .lv.now>span:first-child{color:var(--brass)}
.ladder .lv.now>b{background:rgba(232,176,75,.12);border-radius:6px;padding:2px 6px;display:inline-block}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut)}
.meta b{color:var(--tx)}
ul.why,ul.warn{list-style:none;display:grid;gap:4px;font-size:13px}
ul.why li::before{content:'▸';color:var(--up);margin-right:6px}ul.warn li::before{content:'!';color:var(--amber);font-weight:800;margin-right:8px}
.pk-actions{display:flex;gap:8px;margin-top:2px}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.tblwrap{overflow:auto;border:1px solid var(--rule);border-radius:14px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:13px}
th{position:sticky;top:0;background:var(--sf2);text-align:right;padding:9px 10px;font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap;user-select:none;font-weight:600}
th.l,td.l{text-align:left}
td{padding:8px 10px;border-top:1px solid var(--rule);text-align:right;white-space:nowrap}
tr.r{cursor:pointer}tr.r:active{background:var(--sf2)}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools input{width:auto;flex:1;min-width:140px}
.mon{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--sf);border:1px solid var(--rule);border-radius:12px;cursor:pointer}
.mrow .st{font-size:11.5px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--rule);border-radius:12px;padding:12px}
.stat .v{font-size:20px;font-weight:800;margin-top:2px}
.jrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 12px;background:var(--sf);border:1px solid var(--rule);border-radius:12px;margin-bottom:8px;font-size:13px}
.jrow .sym{font-size:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(12,18,32,.94);backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font-weight:600;font-size:12.5px;padding:10px 4px;border-radius:10px;cursor:pointer}
.tabs button.on{color:var(--brass);background:rgba(232,176,75,.1)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheetIn{background:var(--sf);border:1px solid var(--rule2);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:720px){.sheet{align-items:center}.sheetIn{border-radius:18px}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--sf2);border-radius:9px;padding:8px 10px}.kv .lbl{display:block;margin-bottom:2px}.kv b{font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--sf2);border:1px solid var(--rule2);color:var(--tx);padding:10px 14px;border-radius:10px;font-size:13px;z-index:40;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.help h3{margin:14px 0 6px;font-size:15px;color:var(--brass)}
.help p,.help li{font-size:14px;margin-bottom:6px}.help ol,.help ul{padding-left:20px}
.help code{background:var(--sf2);padding:1px 5px;border-radius:5px;font-size:12.5px}
@media(max-width:640px){.regime{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr 1fr}.brand{font-size:19px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">EDGE<small>Coinbase intraday scanner</small></div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusTxt">Ready</span></div>
  <button id="scanBtn" class="btn primary">Scan now</button>
</header>
<div id="progress" class="progress hidden"><div class="bar"><i id="pbar"></i></div><div id="ptxt" class="ptxt"></div></div>
<div id="banner" class="banner hidden"></div>
<section id="regime" class="card regime hidden"></section>
<details id="settings" class="card settings">
  <summary>Settings <span id="setSum" class="mut"></span></summary>
  <div class="grid4">
    <label class="f">Trade horizon<select id="sHorizon"><option value="4">4 hours</option><option value="8">8 hours</option><option value="12">12 hours</option></select></label>
    <label class="f">Mode<select id="sMode"><option value="conservative">Conservative, A setups only</option><option value="balanced">Balanced, A and B</option><option value="aggressive">Aggressive, adds C and bounces</option></select></label>
    <label class="f">Max picks<select id="sMax"><option>3</option><option>5</option><option>8</option></select></label>
    <label class="f">Rank universe by<select id="sRank"><option value="mcap">Market cap (CoinGecko)</option><option value="volume">Coinbase 24h volume</option></select></label>
    <label class="f">Account size $<input id="sAccount" type="number" min="1" step="1"></label>
    <label class="f">Risk per trade %<input id="sRisk" type="number" min="0.1" step="0.5"></label>
    <label class="f">Round-trip fee %<input id="sFee" type="number" min="0" step="0.1"></label>
    <label class="f">Max position % of account<input id="sAlloc" type="number" min="1" max="100" step="5"></label>
  </div>
</details>
<main>
  <section id="tab-picks" class="tab"></section>
  <section id="tab-scan" class="tab hidden"></section>
  <section id="tab-monitor" class="tab hidden"></section>
  <section id="tab-journal" class="tab hidden"></section>
  <section id="tab-help" class="tab hidden"></section>
</main>
</div>
<nav class="tabs">
  <button data-tab="picks" class="on">Picks</button>
  <button data-tab="scan">Scan</button>
  <button data-tab="monitor">Monitor</button>
  <button data-tab="journal">Journal</button>
  <button data-tab="help">Help</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheetIn"><div id="sheetBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
'use strict';
/* ===================== CONFIG & STATE ===================== */
const CB='https://api.exchange.coinbase.com';
const CG='https://api.coingecko.com/api/v3';
const EXCLUDE=new Set('USDT USDC DAI PYUSD EURC GUSD USDS TUSD FDUSD USDP PAX BUSD WBTC CBBTC CBETH WETH STETH WSTETH LSETH MSOL JITOSOL RETH TBTC PAXG XAUT USDE USD1 RLUSD USDY USD0 FRAX LUSD GHO CRVUSD EUR GBP CBXRP CBADA CBDOGE CBLTC WAXL'.split(' '));
const DEF={horizon:8,mode:'balanced',maxPicks:5,ranking:'mcap',account:500,riskPct:2,feePct:1.2,allocPct:40};
const S={settings:{...DEF},universe:[],analyses:[],picks:[],regime:null,ctx:null,status:'idle',lastScan:null,lastTick:null,journal:[],timer:null,sortKey:'score',sortDir:-1,tab:'picks',demo:false,pickPrices:{},q:''};

/* ===================== UTILS ===================== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const last=a=>a[a.length-1];
const sum=a=>a.reduce((x,y)=>x+y,0);
const mean=a=>a.length?sum(a)/a.length:0;
const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stdev(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-1));}
function fmtPrice(p){if(!(p>0))return '—';const d=p>=100?2:p>=1?3:p>=0.01?4:p>=0.0001?6:8;return '$'+p.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtPct(x,d=1){if(x==null||isNaN(x))return '—';return (x>0?'+':'')+x.toFixed(d)+'%';}
function fmtUsd(v){if(!(v>=0))return '—';if(v>=1e9)return '$'+(v/1e9).toFixed(1)+'B';if(v>=1e6)return '$'+(v/1e6).toFixed(1)+'M';if(v>=1e3)return '$'+(v/1e3).toFixed(0)+'K';return '$'+v.toFixed(0);}
function fmtCoins(c){if(!(c>0))return '0';return c>=100?c.toFixed(1):c>=1?c.toFixed(3):c.toPrecision(4);}
function money(v){return (v<0?'-':'')+'$'+Math.abs(v).toFixed(2);}
function timeStr(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function dateStr(d){return new Date(d).toLocaleDateString([],{month:'short',day:'numeric'});}

/* ===================== INDICATORS ===================== */
function ema(a,p){const k=2/(p+1);const out=[a[0]];for(let i=1;i<a.length;i++)out.push(a[i]*k+out[i-1]*(1-k));return out;}
function rsi(a,p=14){const out=new Array(a.length).fill(50);let g=0,l=0;for(let i=1;i<a.length;i++){const d=a[i]-a[i-1],up=Math.max(d,0),dn=Math.max(-d,0);if(i<=p){g+=up/p;l+=dn/p;if(i===p)out[i]=l===0?100:100-100/(1+g/l);}else{g=(g*(p-1)+up)/p;l=(l*(p-1)+dn)/p;out[i]=l===0?100:100-100/(1+g/l);}}return out;}
function atr(c,p=14){const out=[];let a=0;for(let i=0;i<c.length;i++){const tr=i===0?c[i].h-c[i].l:Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c));a=i<p?a+tr/p:(a*(p-1)+tr)/p;out.push(a);}return out;}
function macd(a){const e12=ema(a,12),e26=ema(a,26);const line=e12.map((v,i)=>v-e26[i]);const sig=ema(line,9);return{line,sig,hist:line.map((v,i)=>v-sig[i])};}
function vwap(c){let pv=0,v=0;for(const x of c){pv+=(x.h+x.l+x.c)/3*x.v;v+=x.v;}return v?pv/v:last(c).c;}
function levels(c,price,minDist){const n=c.length,from=Math.max(5,n-140),K=5;let res=null,sup=null;for(let i=from;i<n-K;i++){const h=c[i].h,l=c[i].l;let sh=true,sl=true;for(let k=1;k<=K;k++){if(c[i-k].h>=h||c[i+k].h>=h)sh=false;if(c[i-k].l<=l||c[i+k].l<=l)sl=false;}if(sh&&h>price+minDist&&(res===null||h<res))res=h;if(sl&&l<price-minDist&&(sup===null||l>sup))sup=l;}return{res,sup};}
function spark(arr,w=96,h=28){if(!arr||arr.length<2)return '';const mn=Math.min(...arr),mx=Math.max(...arr),rng=mx-mn||1;const pts=arr.map((v,i)=>(i/(arr.length-1)*w).toFixed(1)+','+(h-(v-mn)/rng*(h-2)-1).toFixed(1)).join(' ');const up=last(arr)>=arr[0];return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up?'var(--up)':'var(--dn)'}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;}

/* ===================== ANALYSIS ENGINE ===================== */
function analyze(u,c1,c15,ctx){
  if(!c1||c1.length<60||!c15||c15.length<60)return null;
  const C1=c1.map(x=>x.c),C15=c15.map(x=>x.c),n1=c1.length,n15=c15.length;
  const price=C15[n15-1];if(!(price>0))return null;
  const e20=ema(C1,20),e50=ema(C1,50),e9=ema(C15,9),e21=ema(C15,21);
  const ema20=last(e20),ema50=last(e50),ema20p=e20[n1-4],ema9=last(e9),ema21=last(e21);
  const r1=rsi(C1),r15=rsi(C15);const rsi1h=last(r1),rsi15=last(r15),rsi15p=r15[n15-3];
  const atr1=last(atr(c1));const atrPct=atr1/price*100;
  const m=macd(C15);const hist=last(m.hist),histP=m.hist[n15-2];
  const last24=c1.slice(n1-24);const vol24=sum(last24.map(x=>x.c*x.v));
  const prior=[];for(let d=1;d<=6;d++){const a=n1-24*(d+1);if(a<0)break;prior.push(sum(c1.slice(a,n1-24*d).map(x=>x.c*x.v)));}
  const relVol=prior.length?vol24/(mean(prior)||1):1;
  const avg4=sum(c15.map(x=>x.v))/n15*4;const volSurge=avg4?sum(c15.slice(n15-4).map(x=>x.v))/avg4:1;
  const vwap24=vwap(c15.slice(Math.max(0,n15-96)));
  const sess=c15.filter(x=>x.t*1000>=ctx.dayStart);
  const ret=(k,a)=>(a[a.length-1]/a[a.length-1-k]-1)*100;
  const ret1h=ret(4,C15),ret4h=ret(16,C15),ret24h=ret(24,C1),ret7d=ret(Math.min(168,n1-1),C1);
  const lr=[];for(let i=Math.max(1,n1-120);i<n1;i++)lr.push(Math.log(C1[i]/C1[i-1]));
  const sigma1h=stdev(lr);
  const days=new Map();for(const x of c1){const d=new Date(x.t*1000).toISOString().slice(0,10);let g=days.get(d);if(!g){g={h:x.h,l:x.l,o:x.o,n:0};days.set(d,g);}g.h=Math.max(g.h,x.h);g.l=Math.min(g.l,x.l);g.n++;}
  const adrs=[...days.values()].filter(g=>g.n>=22).map(g=>(g.h-g.l)/g.o*100);const adr=adrs.length?mean(adrs.slice(-10)):atrPct*4.5;
  const tH=sess.length?Math.max(...sess.map(x=>x.h)):null,tL=sess.length?Math.min(...sess.map(x=>x.l)):null;
  const rangeUsed=sess.length?((tH-tL)/price*100)/(adr||1):0;
  const lv=levels(c1,price,0.5*atr1);const hi24=Math.max(...last24.map(x=>x.h)),lo24=Math.min(...last24.map(x=>x.l));
  const resistance=lv.res!=null?lv.res:(hi24>price+0.5*atr1?hi24:null);
  const support=lv.sup!=null?lv.sup:(lo24<price-0.5*atr1?lo24:null);
  const distRes=resistance?(resistance-price)/price*100:null,distSup=support?(price-support)/price*100:null;
  const extension=(price-ema20)/(atr1||1);
  const recentLow8=Math.min(...c15.slice(n15-8).map(x=>x.l));

function buildRegime(analyses){
  const btc=analyses.find(a=>a.base==='BTC');const n=analyses.length||1;

  const up24=analyses.filter(a=>a.ret24h>0).length/n*100;
  const avg24=mean(analyses.map(a=>a.ret24h));
  let btcScore=0;if(btc){if(btc.price>btc.ema20)btcScore++;if(btc.ema20>btc.ema50)btcScore++;if(btc.ret4h>0)btcScore++;if(btc.ret24h>0)btcScore++;}
  let label,pts,note;
  if(btcScore>=3&&above>=55){label='RISK-ON';pts=10;note='BTC trend and market breadth are aligned. Full size on A and B setups, take T1 when it prints.';}
  else if(btcScore<=1&&(above<40||avg24<-2)){label='RISK-OFF';pts=0;note='BTC is weak and most of the market sits under its 1h EMA20. Cash is a position today: no new longs, watchlist only, rescan in an hour.';}
  else{label='NEUTRAL';pts=5;note='Mixed tape. Half size, A setups only, and take the first target quickly rather than holding for T2.';}
  return{label,pts,note,btc,above,up24,avg24,btcScore};
}
function planFor(a,ctx){
  const st=ctx.settings,fee=st.feePct,f=Math.sqrt(st.horizon/8),atr=a.atr1,price=a.price,mode=st.mode;
  const trendUp=a.uptrend&&a.ema20Rising;
  let setup='none';
  const macdOk=a.hist>0&&a.hist>=0.7*a.histP,turning=a.hist>=a.histP||a.rsi15>a.rsi15p,nearBase=Math.min(Math.abs(price-a.vwap24),Math.abs(price-a.ema21))/(atr||1)<=0.6;
  if(price>=a.hi24*0.999&&a.volSurge>=1.3&&a.rsi15<80&&a.ret1h<a.atrPct*2.5&&a.ret24h>0)setup='Breakout';
  else if(trendUp&&nearBase&&a.rsi15>=38&&a.rsi15<=62&&turning)setup='Pullback';
  else if(trendUp&&price>a.vwap24&&a.rsi15>=50&&a.rsi15<=74&&macdOk&&a.extension<2)setup='Momentum';
  else if(mode==='aggressive'&&a.rsi1h<32&&a.rsi15>a.rsi15p&&a.rsi15<52&&price>a.ema9&&a.volSurge>=1.2)setup='Bounce';
  let s=0;const why=[],warn=[];
  let t=0;if(price>a.ema20)t+=8;if(a.ema20>a.ema50)t+=8;if(a.ema20Rising)t+=5;if(a.ret24h>0)t+=4;s+=t;
  if(a.uptrend)why.push('1h uptrend: price above EMA20 above EMA50'+(a.ema20Rising?', EMA20 rising':''));else if(price>a.ema20)why.push('Price back above the 1h EMA20');
  let mo=0;if(a.rsi15>=50&&a.rsi15<=70)mo+=8;else if(a.rsi15>=45&&a.rsi15<=75)mo+=4;if(a.hist>0)mo+=6;if(a.hist>a.histP)mo+=2;if(price>a.vwap24)mo+=4;s+=mo;
  if(a.hist>0&&a.hist>a.histP)why.push('15m MACD positive and rising, RSI '+a.rsi15.toFixed(0));else if(a.hist>a.histP)why.push('15m MACD turning up, RSI '+a.rsi15.toFixed(0));
  if(price>a.vwap24)why.push('Holding above the 24h VWAP ('+fmtPrice(a.vwap24)+')');
  let vo=0;if(a.relVol>=1.5)vo+=8;else if(a.relVol>=1.1)vo+=5;else if(a.relVol>=0.8)vo+=2;if(a.volSurge>=1.5)vo+=4;else if(a.volSurge>=1)vo+=2;if(a.vol24>=5e6)vo+=3;else if(a.vol24>=1e6)vo+=1;s+=vo;
  if(a.relVol>=1.1)why.push('Volume '+a.relVol.toFixed(1)+'x its 6-day average, '+fmtUsd(a.vol24)+' traded in 24h');
  if(a.volSurge>=1.5)why.push('Last hour volume '+a.volSurge.toFixed(1)+'x normal');
  let lo=0;const room=a.distRes==null?99:a.distRes/(a.atrPct||1);if(room>=1.5)lo+=8;else if(room>=1)lo+=5;else if(room>=0.5)lo+=2;if(a.extension<=1.5)lo+=6;else if(a.extension<=2.5)lo+=3;if(a.rangeUsed<0.5)lo+=6;else if(a.rangeUsed<0.8)lo+=3;s+=lo;
  if(a.distRes==null)why.push('No overhead resistance in the last 6 days, price discovery');else if(room>=1)why.push('Room to run: next resistance '+fmtPct(a.distRes)+' away ('+room.toFixed(1)+' ATR)');
  if(a.rangeUsed<0.5&&a.tH)why.push('Only '+(a.rangeUsed*100).toFixed(0)+'% of its usual daily range ('+a.adr.toFixed(1)+'%) used so far today');
  const feeRatio=a.atrPct/(fee||0.01);s+=feeRatio>=3?10:feeRatio>=2?7:feeRatio>=1.5?4:1;if(a.atrPct>8){s-=5;warn.push('Very volatile ('+a.atrPct.toFixed(1)+'% hourly ATR), keep size small');}
  if(feeRatio<1.5)warn.push('Fees are large next to this coin\'s hourly range, limit orders only');
  s+=ctx.regime?ctx.regime.pts:5;
  if(a.rsi15>78){s-=10;warn.push('15m RSI '+a.rsi15.toFixed(0)+', extended. Wait for a dip into the buy zone, do not chase');}
  if(a.rsi1h>75){s-=8;warn.push('1h RSI '+a.rsi1h.toFixed(0)+', overbought on the higher timeframe');}
  if(a.ret1h>a.atrPct*2){s-=8;warn.push('Spiked '+fmtPct(a.ret1h)+' in the last hour, entry risk is elevated');}
  if(a.vol24<5e5){s-=25;warn.push('Thin liquidity on Coinbase ('+fmtUsd(a.vol24)+' in 24h), slippage risk');}
  else if(a.vol24<2e6){s-=8;warn.push('Light liquidity ('+fmtUsd(a.vol24)+' in 24h), use limit orders');}
  if(a.rangeUsed>=0.8&&a.tH)warn.push('Already used '+(a.rangeUsed*100).toFixed(0)+'% of its typical daily range');
  if(a.limitOnly)warn.push('Coinbase allows limit orders only on this pair');
  s=clamp(Math.round(s),0,100);
  const raw=price-a.recentLow8+0.1*atr;let stopDist=setup==='Pullback'?clamp(raw,0.6*atr,1.0*atr):setup==='Bounce'?clamp(raw,1.0*atr,1.5*atr):clamp(raw,0.7*atr,1.2*atr);
  const stop=price-stopDist;
  let t1,t2,capped=false;
  if(setup==='Breakout'){t1=price+1.2*atr*f;t2=price+2.4*atr*f;}
  else{t1=price+1.0*atr*f;t2=price+2.0*atr*f;if(a.resistance){const r=a.resistance*0.997;if(r<t1){t1=r;capped=true;}if(r<t2){t2=r;capped=true;}}if(t2<t1)t2=t1;}
  let zLo,zHi;
  if(setup==='Pullback'){zLo=Math.max(a.vwap24,a.ema21)-0.2*atr;zHi=price;if(zLo>=zHi)zLo=price-0.3*atr;}
  else if(setup==='Breakout'){zLo=price-0.1*atr;zHi=price+0.25*atr;}
  else if(setup==='Bounce'){zLo=price-0.2*atr;zHi=price+0.1*atr;}
  else{zLo=price-0.15*atr;zHi=price+0.15*atr;}
  const t1Pct=(t1/price-1)*100,t2Pct=(t2/price-1)*100,stopPct=(1-stop/price)*100;
  const netT1=t1Pct-fee,netT2=t2Pct-fee;
  const grossRR=(0.5*t1Pct+0.5*t2Pct)/(stopPct||0.01),rr=(0.5*t1Pct+0.5*t2Pct-fee)/(stopPct+fee);
  if(capped)warn.push('Resistance at '+fmtPrice(a.resistance)+' caps the targets');
  let reason=null;
  if(setup!=='none'){if(netT1<0.3||t1Pct<fee*1.3){reason='After '+fee+'% round-trip fees the first target nets only '+fmtPct(netT1,2)+', not worth the risk';setup='none';}
  else if(grossRR<0.9){reason='Reward to risk of '+grossRR.toFixed(2)+' before fees is too low, resistance sits too close to the entry';setup='none';}}
  const grade=s>=78?'A':s>=66?'B':s>=55?'C':'-';
  const okGrade=mode==='conservative'?grade==='A':mode==='balanced'?(grade==='A'||grade==='B'):grade!=='-';
  let tradeable=setup!=='none'&&okGrade;
  if(ctx.regime&&ctx.regime.label==='RISK-OFF'&&mode!=='aggressive')tradeable=false;
  if(setup==='none'&&!reason)reason=!trendUp?'No confirmed 1h uptrend, so no long setup':'In an uptrend but no clean entry pattern right now (stretched or drifting)';
  return{setup,score:s,grade,tradeable,reason,why,warn,zLo,zHi,stop,t1,t2,t1Pct,t2Pct,stopPct,netT1,netT2,rr,grossRR,feeShare:fee/(t1Pct||1)*100,capped,stopDist,expMove:a.sigma1h*Math.sqrt(st.horizon)*100};
}
function sizeFor(plan,a,st){const risk=st.account*st.riskPct/100;let usd=risk/((plan.stopPct+st.feePct)/100||0.01);usd=Math.min(usd,st.account*st.allocPct/100,st.account);return{usd,coins:usd/a.price,risk:usd*(plan.stopPct+st.feePct)/100,t1Gain:usd*plan.netT1/100,planGain:usd*(0.5*plan.t1Pct+0.5*plan.t2Pct-st.feePct)/100};}
function selectPicks(items,st){return items.filter(x=>x.plan.tradeable).sort((a,b)=>b.plan.score-a.plan.score||b.plan.rr-a.plan.rr).slice(0,st.maxPicks);}

const limiter=(()=>{const rate=8;let tokens=rate,t=Date.now();return{async acquire(){for(;;){const now=Date.now();tokens=Math.min(rate,tokens+(now-t)/1000*rate);t=now;if(tokens>=1){tokens-=1;return;}await sleep(50);}}};})();
async function api(url,tries=3){let err;for(let i=0;i<tries;i++){await limiter.acquire();try{const r=await fetch(url);if(r.status===429||r.status>=500){err=new Error('HTTP '+r.status);await sleep(700*(i+1));continue;}if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}catch(e){err=e;await sleep(300*(i+1));}}throw err;}
async function pool(items,worker,conc,onP){let i=0,done=0;const out=new Array(items.length);await Promise.all(Array.from({length:Math.min(conc,items.length)},async()=>{while(i<items.length){const k=i++;try{out[k]=await worker(items[k]);}catch(e){out[k]=null;}done++;if(onP)onP(done,items.length);}}));return out;}
async function loadProducts(){const list=await api(CB+'/products');const m=new Map();for(const p of list){if(p.status!=='online'||p.trading_disabled||p.cancel_only||p.auction_mode)continue;if(p.quote_currency!=='USD'&&p.quote_currency!=='USDC')continue;const base=String(p.base_currency).toUpperCase();if(EXCLUDE.has(base))continue;const cur=m.get(base);if(!cur||(p.quote_currency==='USD'&&cur.quote!=='USD'))m.set(base,{id:p.id,base,quote:p.quote_currency,name:base,limitOnly:!!(p.limit_only||p.post_only),rank:null});}if(!m.size)throw new Error('No products returned');return m;}
async function candles(id,g){const raw=await api(CB+'/products/'+id+'/candles?granularity='+g);if(!Array.isArray(raw))throw new Error('bad candles');return raw.map(c=>({t:+c[0],l:+c[1],h:+c[2],o:+c[3],c:+c[4],v:+c[5]})).filter(c=>c.c>0).sort((a,b)=>a.t-b.t);}
async function rankByMcap(m){const mk=await api(CG+'/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false');if(!Array.isArray(mk))throw new Error('bad mcap');const seen=new Set(),out=[];for(const c of mk){const sym=String(c.symbol||'').toUpperCase();if(seen.has(sym))continue;const p=m.get(sym);if(!p)continue;seen.add(sym);out.push({...p,name:c.name||sym,rank:c.market_cap_rank||out.length+1});if(out.length>=100)break;}if(out.length<20)throw new Error('mcap rank too small');return out;}
function makeCtx(){const d=new Date();d.setHours(0,0,0,0);return{dayStart:d.getTime(),settings:S.settings,regime:null};}
async function scan(){
  if(S.status==='scanning')return;
  setStatus('scanning','Connecting');showProgress(1,'Loading Coinbase product list');hideBanner();$('scanBtn').disabled=true;
  const ctx=makeCtx();
  try{
    const m=await loadProducts();
    let uni=null;const c1map=new Map();
    if(S.settings.ranking==='mcap'){try{showProgress(3,'Ranking by market cap');uni=await rankByMcap(m);}catch(e){toast('CoinGecko unavailable, ranking by Coinbase volume instead');}}
    if(!uni){const all=[...m.values()];const res=await pool(all,async u=>({u,c:await candles(u.id,3600)}),6,(d,t)=>showProgress(3+d/t*47,'Ranking '+all.length+' pairs by 24h volume, '+d+'/'+t));
      uni=res.filter(r=>r&&r.c.length>=48).map(r=>({u:r.u,c:r.c,vol:sum(r.c.slice(-24).map(x=>x.c*x.v))})).sort((a,b)=>b.vol-a.vol).slice(0,100).map((r,i)=>{c1map.set(r.u.id,r.c);return{...r.u,rank:i+1};});}
    S.universe=uni;S.demo=false;
    const base=c1map.size?50:4,span=c1map.size?48:94;
    const res=await pool(uni,async u=>{const c1=c1map.get(u.id)||await candles(u.id,3600);const c15=await candles(u.id,900);return{u,c1,c15};},6,(d,t)=>showProgress(base+d/t*span,'Pulling 1h and 15m candles, '+d+'/'+t));
    finishScan(res.filter(Boolean),ctx);
  }catch(e){
    console.error(e);hideProgress();setStatus('blocked','No live data');$('scanBtn').disabled=false;
    showBanner('<b>Live data could not load.</b> This sandbox or your network is blocking outside connections. Download the file and open it in Chrome for live Coinbase data, or load demo data to explore the app.<br><button class="btn sm" onclick="scan()">Try again</button><button class="btn sm" onclick="loadDemo()">Load demo data</button>');
  }
}
function finishScan(res,ctx){
  const analyses=res.map(r=>analyze(r.u,r.c1,r.c15,ctx)).filter(Boolean);
  if(!analyses.length){hideProgress();setStatus('blocked','No usable data');$('scanBtn').disabled=false;showBanner('Coinbase returned no candle data. <button class="btn sm" onclick="scan()">Try again</button>');return;}
  const regime=buildRegime(analyses);ctx.regime=regime;S.ctx=ctx;S.regime=regime;
  S.analyses=analyses.map(a=>{const plan=planFor(a,ctx);return{a,plan,size:sizeFor(plan,a,S.settings)};});
  S.picks=selectPicks(S.analyses,S.settings);S.lastScan=Date.now();S.pickPrices={};
  for(const p of S.picks)p.live={price:p.a.price,t1:false,t2:false,stop:false};
  hideProgress();$('scanBtn').disabled=false;$('scanBtn').textContent='Rescan';
  setStatus(S.demo?'demo':'live',S.demo?'Demo data':'Live, scanned '+timeStr(S.lastScan));
  renderAll();startMonitor();
  toast(S.picks.length?S.picks.length+' setups found, '+regime.label.toLowerCase()+' regime':'No setups meet the bar right now');
}
function recompute(){
  if(!S.analyses.length)return;
  const ctx={...(S.ctx||makeCtx()),settings:S.settings,regime:S.regime};
  const old=new Map(S.picks.map(p=>[p.a.id,p.live]));
  S.analyses=S.analyses.map(it=>{const plan=planFor(it.a,ctx);return{a:it.a,plan,size:sizeFor(plan,it.a,S.settings)};});
  S.picks=selectPicks(S.analyses,S.settings);
  for(const p of S.picks)p.live=old.get(p.a.id)||{price:(S.pickPrices[p.a.id]||{}).price||p.a.price,t1:false,t2:false,stop:false};
  renderAll();
}

function rng(seed){let s=seed>>>0;return()=>{s+=0x6D2B79F5;let t=Math.imul(s^(s>>>15),1|s);t^=t+Math.imul(t^(t>>>7),61|t);return((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function buildDemoRes(){const out=[];const n=1200;const t0=Math.floor(Date.now()/1000/900)*900-(n-1)*900;DEMO.forEach((d,i)=>{const r=rng(1000+i*7919);const drift=(r()-0.42)*0.0012;const c15=[];let p=d[2]*(0.85+r()*0.3);for(let k=0;k<n;k++){const g=gauss(r);const ret=drift+d[3]*g;const o=p,c=o*Math.exp(ret);const h=Math.max(o,c)*(1+Math.abs(gauss(r))*d[3]*0.6),l=Math.min(o,c)*(1-Math.abs(gauss(r))*d[3]*0.6);const v=(1e6/d[2])/(1+i/6)*(0.4+r()*1.2)*(1+2*Math.abs(g));c15.push({t:t0+k*900,o,h,l,c,v});p=c;}const c1=[];for(let k=0;k<n;k+=4){const g=c15.slice(k,k+4);c1.push({t:g[0].t,o:g[0].o,h:Math.max(...g.map(x=>x.h)),l:Math.min(...g.map(x=>x.l)),c:g[3].c,v:sum(g.map(x=>x.v))});}out.push({u:{id:d[0]+'-USD',base:d[0],name:d[1],rank:i+1,limitOnly:false},c1:c1.slice(-300),c15:c15.slice(-300)});});return out;}

  else{h+='<div class="tools"><span class="mut" style="font-size:13px">'+S.picks.length+' setups from '+S.analyses.length+' coins for the next '+st.horizon+'h. Targets shown gross and net of '+st.feePct+'% fees, sized for $'+st.account+' at '+st.riskPct+'% risk per trade.</span></div><div class="picks">'+S.picks.map(pickCard).join('')+'</div>';}
  el.innerHTML=h;}

function ladder(a,plan,px){return '<div class="ladder">'
  +'<div class="lv t2"><span>Sell rest</span><b class="num">'+fmtPrice(plan.t2)+'</b><i class="num">'+fmtPct(plan.t2Pct)+', net '+fmtPct(plan.netT2)+'</i></div>'
  +'<div class="lv t1"><span>Sell half</span><b class="num">'+fmtPrice(plan.t1)+'</b><i class="num">'+fmtPct(plan.t1Pct)+', net '+fmtPct(plan.netT1)+'</i></div>'
  +'<div class="lv now"><span>Now</span><b class="num">'+fmtPrice(px)+'</b><i class="num">'+(px!==a.price?fmtPct((px/a.price-1)*100,2)+' since scan':'at scan')+'</i></div>'
  +'<div class="lv zone"><span>Buy zone</span><b class="num">'+fmtPrice(plan.zLo)+' to '+fmtPrice(plan.zHi)+'</b><i></i></div>'
  +'<div class="lv stop"><span>Exit below</span><b class="num">'+fmtPrice(plan.stop)+'</b><i class="num">-'+plan.stopPct.toFixed(1)+'%</i></div></div>';}

function pickCard(p){const {a,plan,size,live}=p;const px=live?live.price:a.price;
  return '<div class="pick '+plan.grade+'"><div class="pk-head"><div><span class="sym">'+esc(a.base)+'</span><span class="nm">'+esc(a.name)+(a.rank?', #'+a.rank:'')+'</span></div><div class="grade '+plan.grade+'">'+plan.grade+' '+plan.score+'</div></div>'
  +'<div class="pk-row"><span class="price num">'+fmtPrice(px)+'</span><span class="num '+(a.ret24h>=0?'up':'dn')+'">'+fmtPct(a.ret24h)+' 24h</span><span class="chip">'+plan.setup+'</span>'+spark(a.spark)+'</div>'
  +ladder(a,plan,px)
  +'<div class="meta"><span>Reward to risk <b class="num">'+plan.rr.toFixed(1)+'</b></span><span>Size <b class="num">$'+size.usd.toFixed(0)+'</b> ('+fmtCoins(size.coins)+' '+esc(a.base)+')</span><span>If stopped <b class="num dn">-$'+size.risk.toFixed(0)+'</b></span><span>If plan fills <b class="num up">+$'+size.planGain.toFixed(0)+'</b></span><span>Expected move <b class="num">±'+plan.expMove.toFixed(1)+'%</b> in '+S.settings.horizon+'h</span></div>'
  +'<ul class="why">'+plan.why.slice(0,4).map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>'
  +(plan.warn.length?'<ul class="warn">'+plan.warn.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>':'')
  +(live&&(live.t1||live.t2||live.stop)?'<div><span class="chip" style="color:'+(live.stop?'var(--dn)':'var(--up)')+'">'+(live.t2?'Second target reached':live.t1?'First target reached':'Stop level hit')+'</span></div>':'')
  +'<div class="pk-actions"><button class="btn sm primary" onclick="openLog(\''+a.id+'\')">Log trade</button><button class="btn sm" onclick="openSheet(\''+a.id+'\')">Details</button></div></div>';}

const COLS=[['rank','#'],['base','Coin','l'],['price','Price'],['ret1h','1h'],['ret24h','24h'],['score','Score'],['setup','Setup','l'],['trend','Trend','l'],['rsi15','RSI 15m'],['relVol','Rel vol'],['atrPct','ATR %'],['distRes','Room'],['vol24','Vol 24h']];
function rowVal(it,k){if(k==='score')return it.plan.score;if(k==='setup')return it.plan.setup==='none'?'zzz':it.plan.setup;if(k==='trend')return it.a.uptrend?2:it.a.price>it.a.ema20?1:0;const v=it.a[k];return v==null?(k==='distRes'?999:-Infinity):v;}
function sortBy(k){if(S.sortKey===k)S.sortDir*=-1;else{S.sortKey=k;S.sortDir=(k==='base'||k==='setup'||k==='rank')?1:-1;}renderScanTable();}
function renderScan(){const el=$('tab-scan');if(!S.analyses.length){el.innerHTML='<div class="card empty">Run a scan first. Every coin in the top 100 will show up here with its score, setup and key numbers.</div>';return;}
  el.innerHTML='<div class="tools"><input id="q" placeholder="Filter by coin" value="'+esc(S.q)+'" oninput="S.q=this.value;renderScanTable()"><span id="scanCount" class="mut" style="font-size:12px"></span></div><div class="tblwrap" id="scanTbl"></div>';renderScanTable();}
function renderScanTable(){const q=(S.q||'').trim().toUpperCase();let items=S.analyses.filter(it=>!q||it.a.base.includes(q)||String(it.a.name).toUpperCase().includes(q));
  items.sort((x,y)=>{const a=rowVal(x,S.sortKey),b=rowVal(y,S.sortKey);return (typeof a==='string'?a.localeCompare(b):a-b)*S.sortDir;});
  $('scanCount').textContent=items.length+' coins, tap a row for details';
  $('scanTbl').innerHTML='<table><thead><tr>'+COLS.map(c=>'<th class="'+(c[2]||'')+'" onclick="sortBy(\''+c[0]+'\')">'+c[1]+(S.sortKey===c[0]?(S.sortDir<0?' ▾':' ▴'):'')+'</th>').join('')+'</tr></thead><tbody>'
  +items.map(it=>{const a=it.a,p=it.plan;return '<tr class="r" onclick="openSheet(\''+a.id+'\')"><td class="num mut">'+(a.rank||'')+'</td><td class="l"><b>'+esc(a.base)+'</b></td><td class="num">'+fmtPrice(a.price)+'</td><td class="num '+(a.ret1h>=0?'up':'dn')+'">'+fmtPct(a.ret1h)+'</td><td class="num '+(a.ret24h>=0?'up':'dn')+'">'+fmtPct(a.ret24h)+'</td><td class="num"><span class="grade '+p.grade+'" style="padding:2px 6px;margin:0">'+p.grade+' '+p.score+'</span></td><td class="l">'+(p.setup==='none'?'<span class="mut">none</span>':p.setup)+'</td><td class="l '+(a.uptrend?'up':a.price>a.ema20?'':'dn')+'">'+(a.uptrend?'Up':a.price>a.ema20?'Mixed':'Down')+'</td><td class="num">'+a.rsi15.toFixed(0)+'</td><td class="num">'+a.relVol.toFixed(1)+'x</td><td class="num">'+a.atrPct.toFixed(2)+'</td><td class="num">'+(a.distRes==null?'open':fmtPct(a.distRes))+'</td><td class="num">'+fmtUsd(a.vol24)+'</td></tr>';}).join('')+'</tbody></table>';}

function openSheet(id){const it=S.analyses.find(x=>x.a.id===id);if(!it)return;const {a,plan}=it;const px=(S.pickPrices[id]||{}).price||a.price;
  const kv=[['1h trend',a.uptrend?'Up':a.price>a.ema20?'Mixed':'Down'],['1h EMA20 / 50',fmtPrice(a.ema20)+' / '+fmtPrice(a.ema50)],['RSI 1h / 15m',a.rsi1h.toFixed(0)+' / '+a.rsi15.toFixed(0)],['15m MACD',a.hist>0?(a.hist>a.histP?'Positive, rising':'Positive, fading'):(a.hist>a.histP?'Negative, turning up':'Negative')],['24h VWAP',fmtPrice(a.vwap24)],['Volume vs 6d avg',a.relVol.toFixed(2)+'x'],['Last hour volume',a.volSurge.toFixed(2)+'x normal'],['Coinbase 24h volume',fmtUsd(a.vol24)],['ATR (1h)',a.atrPct.toFixed(2)+'%'],['Usual daily range',a.adr.toFixed(1)+'%, '+(a.tH?(a.rangeUsed*100).toFixed(0)+'% used':'n/a')],['Expected move',fmtPct(plan.expMove,1).replace('+','±')+' in '+S.settings.horizon+'h'],['Support',a.support?fmtPrice(a.support)+' ('+fmtPct(-a.distSup)+')':'none nearby'],['Resistance',a.resistance?fmtPrice(a.resistance)+' ('+fmtPct(a.distRes)+')':'none in 6 days'],['24h high / low',fmtPrice(a.hi24)+' / '+fmtPrice(a.lo24)],['1h / 4h / 7d',fmtPct(a.ret1h)+' / '+fmtPct(a.ret4h)+' / '+fmtPct(a.ret7d)]];
  $('sheetBody').innerHTML='<div class="pk-head"><div><span class="sym">'+esc(a.base)+'</span><span class="nm">'+esc(a.name)+(a.rank?', #'+a.rank:'')+'</span><div class="num" style="margin-top:4px"><span class="price">'+fmtPrice(px)+'</span> <span class="'+(a.ret24h>=0?'up':'dn')+'">'+fmtPct(a.ret24h)+' 24h</span></div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="grade '+plan.grade+'">'+plan.grade+' '+plan.score+'</span><button class="btn sm ghost" onclick="closeSheet()">Close</button></div></div>'
  +'<div style="margin:12px 0 4px"><span class="chip">'+(plan.setup==='none'?'No trade':plan.setup+(plan.tradeable?'':', below your grade/regime filter'))+'</span>'+(plan.setup==='none'?'<div class="mut" style="font-size:13.5px;margin-top:8px">'+esc(plan.reason)+'</div>':'')+'</div>'
  +(plan.setup!=='none'?ladder(a,plan,px)+'<div class="meta" style="margin-top:8px"><span>Reward to risk <b class="num">'+plan.rr.toFixed(1)+'</b></span><span>Size <b class="num">$'+it.size.usd.toFixed(0)+'</b></span><span>If stopped <b class="num dn">-$'+it.size.risk.toFixed(0)+'</b></span></div>':'')
  +'<div class="kv">'+kv.map(k=>'<div><span class="lbl">'+k[0]+'</span><b class="num">'+k[1]+'</b></div>').join('')+'</div>'
  +(plan.why.length?'<ul class="why">'+plan.why.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>':'')
  +(plan.warn.length?'<ul class="warn" style="margin-top:8px">'+plan.warn.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>':'')
  +'<div class="pk-actions" style="margin-top:14px"><button class="btn sm primary" onclick="openLog(\''+a.id+'\')">Log trade</button></div>';
  $('sheet').classList.remove('hidden');}

/* ===================== JOURNAL ===================== */
function openLog(id){const it=S.analyses.find(x=>x.a.id===id);if(!it)return;const {a,plan,size}=it;const px=(S.pickPrices[id]||{}).price||a.price;
  $('sheetBody').innerHTML='<div class="pk-head"><div><span class="sym">'+esc(a.base)+'</span><span class="nm">Log a trade</span></div><button class="btn sm ghost" style="margin-left:auto" onclick="closeSheet()">Close</button></div>'
  +'<div class="grid4" style="grid-template-columns:1fr 1fr"><label class="f">Entry price<input id="lEntry" type="number" step="any" value="'+px+'"></label><label class="f">Position size $<input id="lUsd" type="number" step="any" value="'+size.usd.toFixed(2)+'"></label><label class="f">Sell half at<input id="lT1" type="number" step="any" value="'+plan.t1+'"></label><label class="f">Sell rest at<input id="lT2" type="number" step="any" value="'+plan.t2+'"></label><label class="f">Exit below<input id="lStop" type="number" step="any" value="'+plan.stop+'"></label><label class="f">Note<input id="lNote" placeholder="optional"></label></div>'
  +'<p class="mut" style="font-size:12.5px;margin:10px 0">Prices are checked every 60 seconds while the app is open, so a quick wick between checks can be missed. Keep your real sell orders on Coinbase as well.</p><button class="btn primary" onclick="submitLog(\''+a.id+'\')">Save trade</button>';
  $('sheet').classList.remove('hidden');}
function submitLog(id){const it=S.analyses.find(x=>x.a.id===id);if(!it)return;const v=k=>parseFloat($(k).value);const entry=v('lEntry'),usd=v('lUsd'),t1=v('lT1'),t2=v('lT2'),stop=v('lStop');
  if(!(entry>0&&usd>0&&t1>entry&&t2>=t1&&stop<entry)){toast('Check the numbers: exit < entry < sell half <= sell rest');return;}
  const j={uid:'j'+Date.now().toString(36)+Math.floor(Math.random()*1e4),id,base:it.a.base,entry,usd,coins:usd/entry,t1,t2,stop,note:$('lNote').value,openedAt:Date.now(),status:'open',t1Hit:false,last:entry,riskUsd:usd*((entry-stop)/entry+S.settings.feePct/100)};
  S.journal.push(j);save();closeSheet();renderJournal();renderMonitor();showTab('journal');toast(j.base+' logged, tracking targets and stop');startMonitor();}
function unreal(j){const px=j.last||j.entry;return (j.t1Hit?0.5*j.coins*(j.t1-j.entry)+0.5*j.coins*(px-j.entry):j.coins*(px-j.entry))-j.usd*S.settings.feePct/100;}
function closeTrade(j,px,how){const fees=j.usd*S.settings.feePct/100;const pnl=(j.t1Hit?0.5*j.coins*(j.t1-j.entry)+0.5*j.coins*(px-j.entry):j.coins*(px-j.entry))-fees;j.status='closed';j.exit=px;j.how=how;j.pnl=pnl;j.pnlPct=pnl/j.usd*100;j.closedAt=Date.now();j.r=pnl/Math.max(1e-9,j.riskUsd);save();toast(j.base+' closed, '+how+' ('+money(pnl)+')');}
function findJ(uid){return S.journal.find(j=>j.uid===uid);}
function markT1(uid){const j=findJ(uid);if(!j)return;j.t1Hit=true;save();renderJournal();toast(j.base+': half sold, stop is now your entry');}
function delTrade(uid){S.journal=S.journal.filter(j=>j.uid!==uid);save();renderJournal();renderMonitor();}
function clearClosed(){S.journal=S.journal.filter(j=>j.status!=='closed');save();renderJournal();}
function openClose(uid){const j=findJ(uid);if(!j)return;$('sheetBody').innerHTML='<div class="pk-head"><div><span class="sym">'+esc(j.base)+'</span><span class="nm">Close trade</span></div><button class="btn sm ghost" style="margin-left:auto" onclick="closeSheet()">Cancel</button></div><label class="f" style="margin-top:12px">Exit price<input id="cPx" type="number" step="any" value="'+(j.last||j.entry)+'"></label><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" onclick="doClose(\''+uid+'\')">Book it</button></div>';$('sheet').classList.remove('hidden');}
function doClose(uid){const j=findJ(uid);const px=parseFloat($('cPx').value);if(!j||!(px>0)){toast('Enter a valid exit price');return;}closeTrade(j,px,'Closed manually');closeSheet();renderJournal();renderMonitor();}
function renderJournal(){const el=$('tab-journal');const closed=S.journal.filter(j=>j.status==='closed'),open=S.journal.filter(j=>j.status==='open');const wins=closed.filter(j=>j.pnl>0).length,pnl=sum(closed.map(j=>j.pnl)),avgR=closed.length?mean(closed.map(j=>j.r||0)):0;
  let h='<div class="stats"><div class="stat"><span class="lbl">Closed trades</span><div class="v num">'+closed.length+'</div></div><div class="stat"><span class="lbl">Win rate</span><div class="v num">'+(closed.length?(wins/closed.length*100).toFixed(0)+'%':'—')+'</div></div><div class="stat"><span class="lbl">Net profit</span><div class="v num '+(pnl>=0?'up':'dn')+'">'+(closed.length?money(pnl):'—')+'</div></div><div class="stat"><span class="lbl">Average R</span><div class="v num">'+(closed.length?avgR.toFixed(2):'—')+'</div></div></div>';
  if(!S.journal.length)h+='<div class="card empty">No trades logged yet. Use <b>Log trade</b> on a pick and the app tracks it against the two targets and the stop with live prices, then books the result here.</div>';
  if(open.length){h+='<div class="lbl" style="margin:4px 0 8px">Open</div>';for(const j of open){const u=unreal(j);h+='<div class="jrow"><b class="sym">'+esc(j.base)+'</b><span class="num">in '+fmtPrice(j.entry)+', now '+fmtPrice(j.last||j.entry)+'</span><span class="num '+(u>=0?'up':'dn')+'">'+money(u)+'</span><span class="mut num">$'+j.usd.toFixed(0)+', sell half '+fmtPrice(j.t1)+', rest '+fmtPrice(j.t2)+', exit '+fmtPrice(j.stop)+(j.t1Hit?', half sold':'')+'</span><span style="margin-left:auto;display:flex;gap:6px">'+(j.t1Hit?'':'<button class="btn sm" onclick="markT1(\''+j.uid+'\')">Sold half</button>')+'<button class="btn sm primary" onclick="openClose(\''+j.uid+'\')">Close</button><button class="btn sm ghost" onclick="delTrade(\''+j.uid+'\')">Remove</button></span></div>';}}
  if(closed.length){h+='<div class="lbl" style="margin:12px 0 8px">Closed</div>';for(const j of closed.slice().reverse()){h+='<div class="jrow"><b class="sym">'+esc(j.base)+'</b><span class="num '+(j.pnl>=0?'up':'dn')+'">'+money(j.pnl)+' ('+fmtPct(j.pnlPct,2)+')</span><span class="mut">'+esc(j.how)+'</span><span class="mut num">'+fmtPrice(j.entry)+' to '+fmtPrice(j.exit)+', '+dateStr(j.openedAt)+'</span><span style="margin-left:auto"><button class="btn sm ghost" onclick="delTrade(\''+j.uid+'\')">Remove</button></span></div>';}h+='<div style="margin-top:6px"><button class="btn sm ghost" onclick="clearClosed()">Clear closed trades</button></div>';}
  el.innerHTML=h;}

/* ===================== MONITOR (live prices every 60s) ===================== */
function startMonitor(){stopMonitor();if(S.demo)return;S.timer=setInterval(()=>monitorTick(false),60000);}
function stopMonitor(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
async function monitorTick(manual){if(S.demo){if(manual)toast('Live prices are off in demo mode');return;}const ids=new Set(S.picks.map(p=>p.a.id));for(const j of S.journal)if(j.status==='open')ids.add(j.id);if(!ids.size)return;
  const res=await pool([...ids],async id=>({id,tk:await api(CB+'/products/'+id+'/ticker')}),4);const now=Date.now();let changed=false;
  for(const r of res){if(!r||!r.tk)continue;const px=+r.tk.price;if(!(px>0))continue;S.pickPrices[r.id]={price:px,t:now};
    for(const p of S.picks){if(p.a.id!==r.id)continue;const L=p.live;L.price=px;if(px>=p.plan.t1)L.t1=true;if(px>=p.plan.t2)L.t2=true;if(px<=p.plan.stop&&!L.t1)L.stop=true;}
    for(const j of S.journal){if(j.id!==r.id||j.status!=='open')continue;j.last=px;changed=true;
      if(px>=j.t1&&!j.t1Hit){j.t1Hit=true;toast(j.base+' hit the first target: sell half, stop moves to entry');}
      if(px>=j.t2)closeTrade(j,j.t2,'Both targets hit');else if(px<=j.stop&&!j.t1Hit)closeTrade(j,j.stop,'Stopped out');else if(j.t1Hit&&px<=j.entry)closeTrade(j,j.entry,'Half at target, rest at breakeven');}}
  S.lastTick=now;if(changed)save();renderPicks();renderMonitor();renderJournal();if(manual)toast('Prices refreshed');}
function renderMonitor(){const el=$('tab-monitor');const open=S.journal.filter(j=>j.status==='open');
  if(!S.picks.length&&!open.length){el.innerHTML='<div class="card empty">Nothing to watch yet. After a scan, today\'s picks and any logged trades show here with live prices, refreshed every 60 seconds while the page is open.</div>';return;}
  let h='<div class="tools"><span class="mut" style="font-size:13px">'+(S.demo?'Live prices are off in demo mode':'Refreshes every 60s, last '+(S.lastTick?timeStr(S.lastTick):'at scan'))+'</span><button class="btn sm" onclick="monitorTick(true)">Refresh now</button></div><div class="mon">';
  for(const p of S.picks){const L=p.live||{};const px=L.price||p.a.price,chg=(px/p.a.price-1)*100,lo=p.plan.stop,hi=p.plan.t2,pos=clamp((px-lo)/((hi-lo)||1)*100,0,100);
    const st=L.t2?['Target 2 reached','up']:L.t1?['Target 1 reached','up']:L.stop?['Stop hit','dn']:px>=p.a.price?['In profit','up']:['Below entry','mut'];
    h+='<div class="mrow" onclick="openSheet(\''+p.a.id+'\')"><div><b class="sym" style="font-size:16px">'+esc(p.a.base)+'</b><div class="mut" style="font-size:11.5px">'+p.plan.grade+' '+p.plan.setup+'</div></div><div><div class="num" style="display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap"><span>'+fmtPrice(px)+' <span class="'+(chg>=0?'up':'dn')+'">'+fmtPct(chg,2)+'</span></span><span class="mut">half '+fmtPrice(p.plan.t1)+', rest '+fmtPrice(p.plan.t2)+', exit '+fmtPrice(p.plan.stop)+'</span></div><div class="bar" style="margin-top:6px"><i style="width:'+pos+'%;background:'+(L.stop?'var(--dn)':'linear-gradient(90deg,var(--dn),var(--brass),var(--up))')+'"></i></div></div><div class="st '+st[1]+'">'+st[0]+'</div></div>';}
  for(const j of open){const u=unreal(j),px=j.last||j.entry,pos=clamp((px-j.stop)/((j.t2-j.stop)||1)*100,0,100);h+='<div class="mrow" onclick="showTab(\'journal\')"><div><b class="sym" style="font-size:16px">'+esc(j.base)+'</b><div class="mut" style="font-size:11.5px">logged trade</div></div><div><div class="num" style="display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap"><span>'+fmtPrice(px)+' <span class="'+(u>=0?'up':'dn')+'">'+money(u)+'</span></span><span class="mut">in '+fmtPrice(j.entry)+(j.t1Hit?', half sold':'')+'</span></div><div class="bar" style="margin-top:6px"><i style="width:'+pos+'%;background:linear-gradient(90deg,var(--dn),var(--brass),var(--up))"></i></div></div><div class="st '+(u>=0?'up':'dn')+'">'+(u>=0?'Winning':'Losing')+'</div></div>';}
  el.innerHTML=h+'</div>';}

/* ===================== STORAGE (Claude artifact storage, then browser, then memory) ===================== */
const store={mem:{},
  async get(k){if(typeof window!=='undefined'&&window.storage&&window.storage.get){try{const r=await window.storage.get(k,false);return r&&r.value?JSON.parse(r.value):null;}catch(e){return null;}}try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return this.mem[k]||null;}},
  async set(k,v){const s=JSON.stringify(v);if(typeof window!=='undefined'&&window.storage&&window.storage.set){try{await window.storage.set(k,s,false);return;}catch(e){}}try{localStorage.setItem(k,s);}catch(e){this.mem[k]=v;}}};
function save(){store.set('edge_journal',S.journal);store.set('edge_settings',S.settings);}

/* ===================== SETTINGS & HELP ===================== */
const SET=[['sHorizon','horizon',v=>parseInt(v,10)],['sMode','mode',String],['sMax','maxPicks',v=>parseInt(v,10)],['sRank','ranking',String],['sAccount','account',parseFloat],['sRisk','riskPct',parseFloat],['sFee','feePct',parseFloat],['sAlloc','allocPct',parseFloat]];
function bindSettings(){for(const [id,key,cast] of SET){const el=$(id);el.value=S.settings[key];el.onchange=()=>{const v=cast(el.value);if(typeof v==='number'&&!(v>=0)){el.value=S.settings[key];return;}S.settings[key]=v;save();updateSetSum();recompute();};}updateSetSum();}
function updateSetSum(){const s=S.settings;$('setSum').textContent=s.horizon+'h, '+s.mode+', $'+s.account+' at '+s.riskPct+'% risk, '+s.feePct+'% fees';}
function renderHelp(){$('tab-help').innerHTML='<div class="card help">'
 +'<h3>Morning routine</h3><ol><li>Check the regime strip. Risk-off means no new longs, however good a coin looks.</li><li>Tap <b>Scan now</b>. Read the picks top to bottom, best score first.</li><li>Buy only inside the buy zone. If the coin is already running, place a limit order at the low end and let it come to you.</li><li>Set a sell order for half the position at the first target. When it fills, your stop moves up to your entry price.</li><li>Sell the rest at the second target, or the moment price trades below the exit level. No averaging down, no hoping.</li><li>Log the trade so the Journal tracks your real win rate and profit.</li><li>Rescan around midday if everything is closed. Never exceed your max picks per day.</li></ol>'
 +'<h3>How it decides</h3><ul><li>Universe: the top 100 coins by market cap that trade against USD on Coinbase, with stablecoins and wrapped tokens removed.</li><li>Data: Coinbase Exchange public candles, 1h for the last 12 days and 15m for the last 3 days, plus the live ticker. No login, no keys, nothing leaves your device.</li><li>Score out of 100: trend 25, momentum 20, volume 15, location 20, volatility fit 10, market regime 10. Penalties for chasing, overbought readings and thin liquidity. A is 78+, B is 66+, C is 55+.</li><li>Setups: Breakout (new 24h high on a volume surge), Pullback (uptrend dipping to VWAP or the 15m EMA21), Momentum (trend plus MACD and RSI in the sweet spot), Bounce (oversold reversal, aggressive mode only).</li><li>Targets: 1.0 and 1.8 ATR scaled to your horizon, capped just under the nearest resistance. Stop: below the last 3 hours\' low, between 0.8 and 1.5 ATR. Any plan where the first target does not clear your fee setting with room to spare is dropped.</li><li>Sizing: position = (account × risk %) ÷ (stop distance + fees), capped by your max position %.</li></ul>'
 +'<h3>What to expect</h3><p>With a 1 ATR stop and 1 / 1.8 ATR targets, a filtered long in a risk-on tape reaches the first target roughly 55 to 65% of the time. There is no zero-loss setting in any market; the edge comes from the filters, the fee gate, taking the first target consistently and skipping risk-off days. Track it in the Journal and cut anything that stops working.</p>'
 +'<h3>Fees, the real enemy</h3><p>Coinbase Advanced Trade fees depend on your 30-day volume: under $1,000 it is about 1.20% for market orders and 0.60% for limit orders that wait on the book, $1,000 to $10,000 is about 0.75% / 0.35%, above $10,000 about 0.40% / 0.25%. Check your tier on Coinbase. The default 1.2% round trip assumes limit orders at the lowest tier. Set 2.4 if you use market orders under $1,000 of monthly volume. The simple Coinbase app charges roughly 2% or more each way through its spread, set 4 there, which is why day trading from the simple app rarely works.</p><p>Every plan is checked against your fee setting: the first target must net at least 0.3% after fees, and the score rewards coins whose hourly range is at least 2 to 3 times the fee. With 1.2% fees that means coins moving 3% or more a day, so BTC and ETH usually fail the gate on quiet days. That is correct behaviour, not a bug.</p>'
 +'<h3>Install</h3><ul><li><b>Android (Pixel):</b> open this file in Chrome (Files app, tap it, choose Chrome), then menu <code>⋮</code> and <b>Add to Home screen</b>. For a full app install with its own icon and no browser bar, put the file on a free host such as GitHub Pages (upload it as <code>index.html</code>) and add it to the home screen from that https link.</li><li><b>PC:</b> double-click the file. Chrome, Edge and Firefox all work. Bookmark it.</li><li><b>Claude:</b> the preview sandbox blocks internet access, so use <b>Load demo data</b> there to tweak the design, then download for live data.</li></ul>'
 +'<h3>Journal and settings storage</h3><p>Trades and settings save in this browser (or in Claude\'s artifact storage). Clearing site data clears them.</p></div>';}

async function boot(){try{const s=await store.get('edge_settings');if(s&&typeof s==='object')S.settings={...DEF,...s};const j=await store.get('edge_journal');if(Array.isArray(j))S.journal=j;}catch(e){}
  bindSettings();renderAll();renderHelp();$('scanBtn').onclick=()=>scan();
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  $('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
  if(S.journal.some(j=>j.status==='open'))startMonitor();}
if(typeof document!=='undefined'&&document.getElementById('app'))boot();
</script>
</body>
</html>
